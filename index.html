<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escritório Digital</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f2f1ed;--surface:#fff;--navy:#1b2a4a;--navy2:#263a63;
  --text:#1b2a4a;--muted:#64748b;--faint:#94a3b8;
  --border:rgba(27,42,74,.1);--border2:rgba(27,42,74,.22);
  --red:#dc2626;--red-bg:#fef2f2;--red-b:#fecaca;
  --ora:#b45309;--ora-bg:#fffbeb;--ora-b:#fde68a;
  --grn:#15803d;--grn-bg:#f0fdf4;--grn-b:#bbf7d0;
  --blu:#1d4ed8;--blu-bg:#eff6ff;--blu-b:#bfdbfe;
  --amb:#92400e;--amb-bg:#fffbeb;--amb-b:#fcd34d;
  --car:#3b5ea6;--car-bg:#eef2fb;--car-b:#b6c8ef;
  --r:8px;--rl:12px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh;}
a{color:var(--blu);}a:hover{text-decoration:underline;}

/* UPDATE BAR */
#ubar{position:fixed;top:0;left:0;right:0;z-index:200;background:var(--navy);box-shadow:0 2px 12px rgba(0,0,0,.25);}
#utoggle{width:100%;padding:9px 20px;background:transparent;border:none;color:#fff;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
#utoggle:hover{background:var(--navy2);}
#upanel{padding:10px 20px 14px;border-top:1px solid rgba(255,255,255,.12);display:none;}
#ucmd{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:var(--r);color:#fff;font-family:'DM Sans',sans-serif;font-size:12px;padding:10px 12px;resize:vertical;min-height:70px;outline:none;}
#ucmd::placeholder{color:rgba(255,255,255,.4);}
#ucmd:focus{border-color:rgba(255,255,255,.5);}
#uactions{display:flex;gap:8px;margin-top:8px;align-items:center;}
#ufeedback{font-size:11px;color:#86efac;flex:1;}
.btn-apply{padding:7px 18px;background:#fff;color:var(--navy);border:none;border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;}
.btn-apply:hover{background:#e2e8f0;}
.btn-uhelp{padding:7px 10px;background:transparent;border:1px solid rgba(255,255,255,.25);border-radius:var(--r);color:rgba(255,255,255,.7);font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer;}

/* DRAWER — quick edit panel */
#drawer-bg{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.35);}
#drawer-bg.open{display:block;}
#drawer{position:fixed;top:0;right:0;height:100%;width:440px;max-width:95vw;background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.18);z-index:401;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);}
#drawer.open{transform:translateX(0);}
#drawer-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;}
#drawer-title{font-size:14px;font-weight:600;color:var(--navy);}
#drawer-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;padding:2px 6px;}
#drawer-body{flex:1;overflow-y:auto;padding:20px;}
#drawer-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;}

/* MODALS */
.modal-bg{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.45);align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal-box{background:#fff;border-radius:var(--rl);padding:24px;width:92%;max-width:580px;max-height:90vh;overflow-y:auto;}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-hdr h3{font-size:15px;font-weight:600;}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;}

/* LAYOUT */
#app{max-width:1120px;margin:0 auto;padding:20px;}
#hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:12px;flex-wrap:wrap;}
#hdr h1{font-size:20px;font-weight:600;}
#hdr p{font-size:12px;color:var(--muted);margin-top:2px;}
#hdr-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
#sync-badge{font-size:11px;color:var(--faint);}
.alert-pill{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;}
.pill-red{background:var(--red-bg);color:var(--red);}
.pill-grn{background:var(--grn-bg);color:var(--grn);}
.hdr-btn{padding:6px 12px;background:transparent;border:1px solid var(--border2);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer;color:var(--muted);}
.hdr-btn:hover{background:var(--surface);}

/* TABS */
#tabs{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto;}
.tab{padding:8px 16px;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;}
.tab.on{color:var(--navy);border-bottom-color:var(--navy);}

/* METRICS */
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px;}
.met{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;}
.met-lbl{font-size:11px;color:var(--muted);font-weight:500;}
.met-val{font-size:22px;font-weight:600;margin-top:4px;}

/* TIMELINE unificada */
.timeline{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;}
.tl-item{display:flex;gap:12px;align-items:stretch;cursor:pointer;border-radius:var(--rl);padding:10px 14px;border:1px solid var(--border);background:var(--surface);transition:box-shadow .15s,border-color .15s;}
.tl-item:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);border-color:var(--border2);}
.tl-item.tl-overdue{background:var(--red-bg);border-color:var(--red-b);}
.tl-item.tl-urgent{background:var(--ora-bg);border-color:var(--ora-b);}
.tl-item.tl-near{background:#f8faff;border-color:var(--blu-b);}
.tl-item.tl-honor{background:#fafaf9;border-color:var(--border);}
.tl-dot{width:8px;min-width:8px;border-radius:4px;margin:2px 0;}
.tl-overdue .tl-dot{background:var(--red);}
.tl-urgent .tl-dot{background:var(--ora);}
.tl-near .tl-dot{background:var(--blu);}
.tl-honor .tl-dot{background:var(--navy);}
.tl-content{flex:1;min-width:0;}
.tl-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:1px;}
.tl-overdue .tl-label{color:var(--red);}
.tl-urgent .tl-label{color:var(--ora);}
.tl-near .tl-label{color:var(--blu);}
.tl-honor .tl-label{color:var(--navy);}
.tl-main{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tl-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.tl-right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:4px;flex-shrink:0;}
.tl-days{font-size:18px;font-weight:700;line-height:1;}
.tl-overdue .tl-days{color:var(--red);}
.tl-urgent .tl-days{color:var(--ora);}
.tl-near .tl-days{color:var(--blu);}
.tl-cal-btn{font-size:10px;background:none;border:1px solid var(--border2);border-radius:5px;padding:2px 6px;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif;white-space:nowrap;}
.tl-cal-btn:hover{background:var(--blu-bg);border-color:var(--blu-b);color:var(--blu);}

/* prov row clicavel */
.prov-row{padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;border-radius:4px;padding-left:4px;transition:background .1s;}
.prov-row:hover{background:#f8f7f4;}
.prov-row h4{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prov-row p{font-size:10px;color:var(--muted);margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

.wait-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
.chip-ora{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;background:var(--ora-bg);color:var(--ora);border:1px solid var(--ora-b);cursor:pointer;}
.chip-ora:hover{opacity:.8;}
.pje-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pje-a{display:block;background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:12px 16px;text-decoration:none;}
.pje-a:hover{border-color:var(--navy);}
.pje-a h4{font-size:12px;font-weight:600;color:var(--navy);}
.pje-a p{font-size:10px;color:var(--blu);margin-top:2px;}

/* CASOS */
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.filters{display:flex;gap:6px;}
.fbtn{padding:5px 12px;border:1px solid var(--border2);border-radius:20px;background:transparent;font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer;color:var(--muted);}
.fbtn.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.btn-new{padding:7px 16px;background:var(--navy);color:#fff;border:none;border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;}
.btn-new:hover{background:var(--navy2);}
.casos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;}
.ccard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;border-left:3px solid transparent;cursor:pointer;transition:box-shadow .15s;}
.ccard:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);}
.ccard.v-urgent{border-left-color:var(--red);border-color:var(--red-b);}
.ccard.v-near{border-left-color:var(--ora);border-color:var(--ora-b);}
.ccard.v-car{border-left-color:var(--car);border-color:var(--car-b);}
.ccar-badge{display:inline-block;background:var(--car-bg);color:var(--car);font-size:9px;padding:2px 7px;border-radius:4px;font-weight:500;margin-bottom:5px;}
.ccard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:4px;}
.ccard-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.ccard-meta{font-size:10px;color:var(--muted);margin-bottom:5px;}
.ccard-subj{font-size:11px;color:var(--muted);margin-bottom:8px;}
.ccard-next{background:#f8f7f4;border-radius:6px;padding:7px 9px;margin-bottom:8px;}
.ccard-next-lbl{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;font-weight:500;}
.ccard-next-txt{font-size:11px;margin-top:2px;}
.ccard-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;}
.badge{display:inline-block;font-size:10px;font-weight:500;padding:2px 7px;border-radius:5px;}
.b-info{background:var(--blu-bg);color:var(--blu);}
.b-warn{background:var(--ora-bg);color:var(--ora);}
.b-danger{background:var(--red-bg);color:var(--red);}
.b-success{background:var(--grn-bg);color:var(--grn);}
.b-muted{background:#f1f5f9;color:var(--muted);}
.alink{background:none;border:none;font-family:'DM Sans',sans-serif;font-size:10px;color:var(--muted);cursor:pointer;padding:2px 4px;}
.alink:hover{text-decoration:underline;}
.alink.del{color:var(--red);}

/* FORMS */
.eform{background:#f8f7f4;border:1px solid var(--border);border-radius:var(--rl);padding:16px;margin-bottom:16px;}
.eform-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.eform-hdr h3{font-size:13px;font-weight:600;}
.fg{display:flex;flex-direction:column;gap:3px;}
.fg label{font-size:11px;color:var(--muted);font-weight:500;}
.fg input,.fg select,.fg textarea{padding:7px 10px;border:1px solid var(--border2);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text);background:#fff;outline:none;width:100%;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--navy);}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fgrid .full{grid-column:span 2;}
.factions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;}
.btn{padding:7px 16px;border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;}
.btn-pri{background:var(--navy);color:#fff;border:1px solid var(--navy);}
.btn-pri:hover{background:var(--navy2);}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border2);}
.btn-ghost:hover{background:#f1f5f9;}
.btn-sm{padding:4px 10px;font-size:11px;}

/* HONORÁRIOS */
.hcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:12px;}
.hcard-name{font-size:14px;font-weight:600;margin-bottom:12px;}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.hbox{background:#f8f7f4;border-radius:var(--r);padding:12px;}
.hbox-lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.hbox-main{font-size:15px;font-weight:600;margin-bottom:2px;}
.hbox-sub{font-size:11px;color:var(--muted);}
.hbar{height:4px;background:#e5e7eb;border-radius:2px;margin-top:8px;}
.hbar-fill{height:100%;border-radius:2px;transition:width .3s;}
.hbar-pct{font-size:10px;color:var(--muted);margin-top:3px;}
.hdet{border:1px solid var(--border);border-radius:var(--rl);padding:14px;margin-bottom:8px;background:#fafaf9;}
.hdet-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.hdet-tipo{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);}
.hdet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;}
.hdet-field{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;}
.hdet-field-lbl{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;font-weight:500;margin-bottom:2px;}
.hdet-field-val{font-size:12px;font-weight:500;}
.hdet-field-val.grn{color:var(--grn);}
.hdet-field-val.red{color:var(--red);}
.hdet-field-val.ora{color:var(--ora);}
.hdet-obs{margin-top:8px;font-size:11px;color:var(--muted);font-style:italic;padding:6px 8px;background:#fff;border-radius:var(--r);border:1px solid var(--border);}
.hedit{background:var(--blu-bg);border:1px solid var(--blu-b);border-radius:var(--rl);padding:14px;margin-bottom:8px;}
.hedit-lbl{font-size:11px;font-weight:600;color:var(--blu);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;}

/* PROSPECÇÃO */
.pipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;}
.pipe-col-h{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:11px 12px;margin-bottom:6px;}
.pcard h4{font-size:12px;font-weight:600;margin-bottom:2px;}
.pcard .psub{font-size:10px;color:var(--muted);}
.pcard .pnotes{font-size:10px;color:var(--muted);font-style:italic;margin-top:3px;}
.pcard .pfu{font-size:9px;color:var(--ora);margin-top:3px;font-weight:500;}
.pcard-foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:4px;}
.pcard-foot select{font-size:10px;padding:2px 5px;border:1px solid var(--border2);border-radius:var(--r);font-family:'DM Sans',sans-serif;background:#f8f7f4;flex:1;}

/* CONTÁBIL */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:12px;}
.check-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.check-item input{width:15px;height:15px;cursor:pointer;accent-color:var(--navy);flex-shrink:0;}
.check-item label{font-size:13px;cursor:pointer;}
.check-item.done label{text-decoration:line-through;color:var(--muted);}
.das-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;}
.nf-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;}

/* LINKEDIN */
.lipipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:16px;}
.licard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:12px;margin-bottom:6px;}
.licard p{font-size:12px;margin-bottom:6px;}
.licard small{font-size:10px;color:var(--muted);}
.licard-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:4px;}
.licard-foot select{font-size:10px;padding:2px 5px;border:1px solid var(--border2);border-radius:var(--r);font-family:'DM Sans',sans-serif;background:#f8f7f4;flex:1;}

.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
hr{border:none;border-top:1px solid var(--border);margin:16px 0;}
pre{background:#f8f7f4;border:1px solid var(--border);border-radius:var(--r);padding:12px;font-size:11px;line-height:1.7;overflow-x:auto;white-space:pre-wrap;}
.sec-title{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}

/* TAGS — global, todas as abas */
.tag-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500;border:1px solid;cursor:pointer;transition:opacity .15s;white-space:nowrap;}
.tag-pill:hover{opacity:.8;}
.tag-filter-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--navy);color:#fff;border-radius:var(--r);margin-bottom:16px;font-size:12px;}
.tag-filter-bar button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:20px;padding:2px 8px;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.tag-filter-bar button:hover{background:rgba(255,255,255,.35);}
.tag-color-swatch{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;}
.tag-color-swatch.sel{border-color:var(--navy);transform:scale(1.2);}

/* DRAWER FORM */
.drawer-section{margin-bottom:18px;}
.drawer-section h4{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.info-row{display:flex;justify-content:space-between;align-items:flex-start;padding:5px 0;font-size:12px;}
.info-row .lbl{color:var(--muted);flex-shrink:0;margin-right:8px;}
.info-row .val{font-weight:500;text-align:right;}
.next-steps-box{background:#f8f7f4;border-radius:var(--r);padding:10px 12px;font-size:12px;line-height:1.6;margin-top:6px;}
.honor-mini{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:6px;font-size:12px;}
.honor-mini-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.parcela-mini{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px;}
.parcela-mini input[type=checkbox]{accent-color:var(--grn);}

@media(max-width:640px){
  .dash-grid,.pje-grid{grid-template-columns:1fr;}
  .casos-grid,.pipe,.lipipe{grid-template-columns:1fr;}
  .fgrid{grid-template-columns:1fr;}
  .fgrid .full{grid-column:span 1;}
  .hgrid,.hdet-grid{grid-template-columns:1fr;}
  #drawer{width:100%;max-width:100%;}
}
</style>
</head>
<body>

<!-- UPDATE BAR -->
<div id="ubar">
  <button id="utoggle" onclick="toggleU()">
    <span id="utoggle-lbl">↑ COLAR ATUALIZAÇÃO DO CLAUDE</span>
    <span id="sync-badge" style="font-size:11px;opacity:.8"></span>
  </button>
  <div id="upanel">
    <textarea id="ucmd" placeholder="Cole aqui o comando UPDATE do Claude:

UPDATE
caso: Barreira → status: encerrado
caso: Genesys Cumprimento → nextSteps: Contestação protocolada
prospecção: Von Trapp → stage: proposta"></textarea>

      S.casos=d.casos;
      if(d.prospeccao)S.prospeccao=d.prospeccao;

}

function sortC(l){
  return[...l].sort((a,b)=>{
    const da=getDL(a),db=getDL(b),ao=da!==null&&da<0,bo=db!==null&&db<0;
    if(ao&&!bo)return-1;if(!ao&&bo)return 1;
    if(da!==null&&db!==null)return da-db;
    if(da!==null)return-1;if(db!==null)return 1;
    const ae=a.status==='encerrado',be=b.status==='encerrado';
    if(ae&&!be)return 1;if(!ae&&be)return-1;
    return a.client.localeCompare(b.client,'pt-BR');
  });
}

// ══ PARCELAS — LÓGICA CORRETA ══════════════════════════
// Retorna a próxima parcela NÃO paga de um honorário
function getProximaParcelaAberta(h){
  const parcelas=h.parcelas||[];
  // ordenar por vencimento
  const sorted=[...parcelas].sort((a,b)=>{
    if(!a.vencimento&&!b.vencimento)return 0;
    if(!a.vencimento)return 1;
    if(!b.vencimento)return-1;
    return a.vencimento.localeCompare(b.vencimento);
  });
  return sorted.find(p=>!p.pago)||null;
}
// Calcula o total já pago de um honorário (via parcelas se existirem, senão via campo pago)
function getPago(h){
  const parcelas=h.parcelas||[];
  if(parcelas.length>0)return parcelas.filter(p=>p.pago).reduce((s,p)=>s+(p.valor||0),0);
  return h.pago||0;
}
// Coleta todas as próximas parcelas abertas para o painel (dentro de N dias ou vencidas)
function getAllProximasParcelas(dias=60){
  const now=new Date();
  const result=[];
  S.casos.forEach(c=>{
    (c.honorarios||[]).forEach(h=>{
      const prox=getProximaParcelaAberta(h);
      if(prox&&prox.vencimento){
        const d=new Date(prox.vencimento+'T12:00:00');
        const dl=Math.ceil((d-now)/864e5);
        result.push({casoId:c.id,client:c.client,parcela:prox,honorarioId:h.id,tipo:h.tipo,dl});
      } else if(prox&&!prox.vencimento){
        // sem data mas existe parcela aberta — incluir sem ordenação por data
        result.push({casoId:c.id,client:c.client,parcela:prox,honorarioId:h.id,tipo:h.tipo,dl:null});
      }
    });
  });
  result.sort((a,b)=>{
    if(a.dl===null&&b.dl===null)return 0;
    if(a.dl===null)return 1;
    if(b.dl===null)return-1;
    return a.dl-b.dl;
  });
  return result;
}

// ══ URGENTES — LISTA UNIFICADA ═════════════════════════
function getUrgent(){
  const items=[];const t=new Date();t.setHours(0,0,0,0);const in7=new Date(t.getTime()+7*864e5);
  S.casos.forEach(c=>{if(!c.deadline)return;const d=new Date(c.deadline+'T12:00:00');
    if(d<t)items.push({sort:d.getTime(),label:'VENCIDO: '+c.client+' ('+fDate(c.deadline)+')'});
    else if(d<=in7)items.push({sort:d.getTime(),label:Math.ceil((d-t)/864e5)+'d: '+c.client+' — '+fDate(c.deadline)});
  });
  items.sort((a,b)=>a.sort-b.sort);
  const now=new Date();const mk=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const cd=S.contabil[mk]||{};
  if(!cd.dasPago){const dd=new Date(now.getFullYear(),now.getMonth(),20);const dl=Math.ceil((dd-now)/864e5);
    if(dl<=7)items.push({label:'DAS vence '+(dl<=0?'HOJE/ATRASADO':'em '+dl+'d')+' — dia 20'});}
  S.casos.forEach(c=>(c.honorarios||[]).forEach(h=>{
    if(h.followupDate&&new Date(h.followupDate+'T12:00:00')<=now)
      items.push({label:'Cobrar honorários: '+c.client+' ('+fDate(h.followupDate)+')'});
  }));
  S.prospeccao.forEach(p=>{if(p.stage==='aguardando'&&p.followupDate&&new Date(p.followupDate+'T12:00:00')<=now)items.push({label:'Follow-up: '+p.name});});
  return items.map(i=>i.label);
}

// ══ GOOGLE CALENDAR LINK ═══════════════════════════════
function gcalLink(title,date,details){
  if(!date)return'';
  const d=date.replace(/-/g,'');
  const next=new Date(date+'T12:00:00');next.setDate(next.getDate()+1);
  const end=next.toISOString().slice(0,10).replace(/-/g,'');
  const base='https://calendar.google.com/calendar/render?action=TEMPLATE';
  return base+'&text='+encodeURIComponent('[Escritório] '+title)+'&dates='+d+'/'+end+'&details='+encodeURIComponent(details||'');
}

    const slo=sel.trim().toLowerCase();
    if(slo.startsWith('caso:')){
      const q=slo.slice(5).trim();const c=S.casos.find(x=>x.client.toLowerCase().includes(q));
      if(!c){errs.push(q);continue;}applyC(c,field,value);ok++;
    }else if(slo.startsWith('prospecção:')||slo.startsWith('prospeccao:')){
      const q=slo.replace(/prospec[çc][aã]o:/,'').trim();
      const p=S.prospeccao.find(x=>x.name.toLowerCase().includes(q));
      if(!p){errs.push(q);continue;}applyP(p,field,value);ok++;
    }
  }
  if(ok>0){saveData();render();showFb('✓ '+ok+' atualização'+(ok>1?'ões':'')+' aplicada'+(ok>1?'s':''));document.getElementById('ucmd').value='';}
  else showFb('⚠ Nenhuma atualização'+(errs.length?' — não encontrado: '+errs[0]:''),true);
}
function applyC(c,field,value){
  const fm={status:'status',nextsteps:'nextSteps',providencias:'nextSteps','providências':'nextSteps',deadline:'deadline',prazo:'deadline',processnumber:'processNumber',processo:'processNumber',subject:'subject',assunto:'subject',tribunal:'tribunal'};
  const sm={'em andamento':'em_andamento','em_andamento':'em_andamento',andamento:'em_andamento',aguardando:'aguardando',encerrado:'encerrado',liminar:'liminar',recurso:'recurso'};
  const f=fm[field]||field;
  if(f==='status')c.status=sm[value.toLowerCase()]||value;
  else if(f==='deadline'){if(/^\d{2}\/\d{2}\/\d{4}$/.test(value)){const[d,m,y]=value.split('/');c.deadline=y+'-'+m+'-'+d;}else c.deadline=value;}
  else if(f in c)c[f]=value;
}
function applyP(p,field,value){
  const fm={stage:'stage','estágio':'stage',estagio:'stage',notes:'notes',subject:'subject',assunto:'subject',followup:'followupDate',lastcontact:'lastContact'};
  const sm={'contato a ser feito':'a_contatar','a contatar':'a_contatar','contato feito':'contato',contato:'contato','análise':'analise',analise:'analise',pesquisa:'pesquisa','proposta enviada':'proposta',proposta:'proposta','aguardando retorno':'aguardando',aguardando:'aguardando',contratou:'fechado',fechado:'fechado','não contratou':'perdido',perdido:'perdido'};
  const f=fm[field.toLowerCase()]||field;
  if(f==='stage')p.stage=sm[value.toLowerCase()]||value;
  else if(f in p)p[f]=value;
}

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <div class="sec-title" style="margin:0">📋 Providências pendentes</div>
    <span style="font-size:10px;color:var(--muted)">clique para editar</span>
  </div>
  ${acoes.map(c=>{const dl=getDL(c),urg=dl!==null&&dl<=7,ov=dl!==null&&dl<0;
    return`<div class="prov-row" onclick="openDrawer('${c.id}','caso')" style="cursor:pointer">
      <div style="display:flex;justify-content:space-between;gap:4px;align-items:flex-start">
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.client}</div>
          <div style="font-size:10px;color:var(--muted);margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${c.nextSteps}</div>
        </div>
        <div style="display:flex;gap:4px;flex-shrink:0;align-items:center;padding-left:6px">
          ${ov?`<span class="badge b-danger">ATRS</span>`:urg?`<span class="badge b-warn">${dl}d</span>`:''}
          ${c.group==='carneiros'?`<span class="badge" style="background:var(--car-bg);color:var(--car);font-size:9px">C&D</span>`:''}
          ${(c.tagIds||[]).map(id=>tagPill(id)).join('')}
        </div>
      </div>
    </div>`;}).join('')}
</div>
<div>
  ${waitP.length?`<div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div class="sec-title" style="margin:0">⏳ Prospecção — aguardando</div>
      <button style="font-size:10px;color:var(--blu);background:none;border:none;cursor:pointer" onclick="setTab('prospeccao')">ver todas →</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:16px">
      ${waitP.slice(0,6).map(p=>{const fuV=p.followupDate&&new Date(p.followupDate+'T12:00:00')<=new Date();return`<div onclick="openDrawer('${p.id}','prosp')" style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--surface);border:1px solid ${fuV?'var(--ora-b)':'var(--border)'};border-radius:var(--r);cursor:pointer;transition:box-shadow .1s" onmouseover="this.style.boxShadow='0 2px 8px rgba(0,0,0,.07)'" onmouseout="this.style.boxShadow=''">
        <div><div style="font-size:12px;font-weight:500">${p.name}</div>${p.subject?`<div style="font-size:10px;color:var(--muted)">${p.subject}</div>`:''}</div>
        ${fuV?`<span style="font-size:10px;font-weight:600;color:var(--ora)">Follow-up!</span>`:p.followupDate?`<span style="font-size:10px;color:var(--muted)">${fDate(p.followupDate)}</span>`:''}
      </div>`;}).join('')}
      ${waitP.length>6?`<div style="font-size:11px;color:var(--muted);text-align:center;padding:4px">+${waitP.length-6} mais</div>`:''}
    </div>
  </div>`:''}
  <div class="sec-title">Monitoramento PJe</div>
  <div class="pje-grid">${PJE.map(l=>`<a class="pje-a" href="${l.url}" target="_blank"><h4>${l.label}</h4><p>Ver publicações →</p></a>`).join('')}</div>
</div>
</div>`;
}

// ─── CASOS ─────────────────────────────────────────────
function bCasos(){
  const list=sortC(filterByTag(S.casos.filter(c=>S.filter==='todos'||(S.filter==='judicial'&&c.type==='judicial')||(S.filter==='consultivo'&&c.type==='consultivo'))));
  const editC=S.editId?S.casos.find(c=>c.id===S.editId):null;
  return`${tagFilterBanner()}<div class="top-bar">
<div class="filters">${['todos','judicial','consultivo'].map(f=>`<button class="fbtn${S.filter===f?' on':''}" onclick="setFilter('${f}')">${f.charAt(0).toUpperCase()+f.slice(1)}</button>`).join('')}</div>
<button class="btn-new" onclick="openModal('caso')">+ Novo caso</button>
</div>
${editC?`<div class="eform">${casoForm(editC,true)}</div>`:''}
<div class="casos-grid">
${list.map(c=>{
  const dl=getDL(c),ov=dl!==null&&dl<0,urg=dl!==null&&dl<=7&&!ov,car=c.group==='carneiros';
  const tUrl=c.tribunal&&TRIBUNAIS[c.tribunal]?TRIBUNAIS[c.tribunal]:null;
  const caseTags=(c.tagIds||[]).map(id=>tagPill(id)).join('');
  return`<div class="ccard ${ov?'v-urgent':urg?'v-near':car?'v-car':''}" onclick="openDrawer('${c.id}','caso')">
  ${car?`<div class="ccar-badge">Carneiros</div>`:''}
  <div class="ccard-top"><div class="ccard-name">${c.client}</div><span class="badge ${sBadge(c.status)}">${sLabel(c.status)}</span></div>
  <div class="ccard-meta">${c.type==='consultivo'?'Consultivo':c.tribunal||'—'}${c.processNumber?' — '+c.processNumber:''}</div>
  ${c.subject?`<div class="ccard-subj">${c.subject}</div>`:''}
  ${c.nextSteps?`<div class="ccard-next"><div class="ccard-next-lbl">Próximas providências</div><div class="ccard-next-txt">${c.nextSteps}</div></div>`:''}
  ${caseTags?`<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px" onclick="event.stopPropagation()">${caseTags}</div>`:''}
  <div class="ccard-foot" onclick="event.stopPropagation()">
    <div style="display:flex;gap:8px;align-items:center">
      ${tUrl?`<a href="${tUrl}" target="_blank" style="font-size:10px" onclick="event.stopPropagation()">${c.tribunal}</a>`:''}
      ${dl!==null?`<span style="font-size:10px;color:${ov?'var(--red)':urg?'var(--ora)':'var(--muted)'}">${ov?'Vencido':'Prazo'}: ${fDate(c.deadline)}</span>`:''}
    </div>
    <div><button class="alink" onclick="event.stopPropagation();startEdit('${c.id}')">Editar</button><button class="alink del" onclick="event.stopPropagation();delC('${c.id}')">×</button></div>
  </div>
</div>`;}).join('')}
</div>`;
}
function casoForm(c,inline){
  return`<div class="eform-hdr"><h3>${c?'Editando: '+c.client:'Novo caso'}</h3><button class="btn btn-ghost btn-sm" onclick="${inline?'cancelEdit()':'closeModal()'}">×</button></div>
<div class="fgrid">
  <div class="fg"><label>Cliente *</label><input id="fi-c" value="${esc(c?c.client:'')}"></div>
  <div class="fg"><label>Tipo</label><select id="fi-t"><option value="judicial" ${!c||c.type==='judicial'?'selected':''}>Judicial</option><option value="consultivo" ${c&&c.type==='consultivo'?'selected':''}>Consultivo</option></select></div>
  <div class="fg"><label>Tribunal</label><select id="fi-tr"><option value="">—</option>${Object.keys(TRIBUNAIS).map(t=>`<option value="${t}" ${c&&c.tribunal===t?'selected':''}>${t}</option>`).join('')}</select></div>
  <div class="fg"><label>Número do processo</label><input id="fi-p" value="${esc(c?c.processNumber:'')}"></div>
  <div class="fg full"><label>Assunto</label><input id="fi-s" value="${esc(c?c.subject:'')}"></div>
  <div class="fg"><label>Status</label><select id="fi-st">${['em_andamento','aguardando','liminar','recurso','encerrado'].map(s=>`<option value="${s}" ${c&&c.status===s?'selected':''}>${sLabel(s)}</option>`).join('')}</select></div>
  <div class="fg"><label>Prazo</label><input id="fi-d" type="date" value="${c&&c.deadline?c.deadline:''}"></div>
  <div class="fg full"><label>Próximas providências</label><textarea id="fi-n" rows="3" style="resize:vertical">${esc(c?c.nextSteps:'')}</textarea></div>
  <div class="fg full"><label>Tags</label><div style="margin-top:4px">${tagCheckboxes(c?c.tagIds||[]:[],'fi-tag-')}</div></div>
</div>
<div class="factions">
  <button class="btn btn-ghost" onclick="${inline?'cancelEdit()':'closeModal()'}">${inline?'Cancelar':'Fechar'}</button>
  <button class="btn btn-pri" onclick="saveC('${c?c.id:''}')">${c?'Salvar alterações':'Criar caso'}</button>
</div>`;
}

// ─── HONORÁRIOS ────────────────────────────────────────
function setHonFilter(f){S.honFilter=f;render();}
function bHon(){
  // ── Totais globais
  let gPL=0,gPLpago=0,gEx=0,gExpago=0;
  S.casos.forEach(c=>(c.honorarios||[]).forEach(h=>{
    const pago=getPago(h);
    if(h.tipo==='proLabore'){gPL+=h.valor||0;gPLpago+=pago;}
    else{gEx+=h.valor||0;gExpago+=pago;}
  }));
  const gTotal=gPL+gEx,gPago=gPLpago+gExpago;
  const gPct=gTotal>0?Math.round(gPago/gTotal*100):0;

  const hf=S.honFilter||'pendentes';
  let baseCasos=filterByTag(S.casos);
  let casosVisiveis=baseCasos.filter(c=>{
    const hs=c.honorarios||[];
    if(hf==='todos') return hs.length>0;
    if(hf==='pendentes') return hs.some(h=>getPago(h)<(h.valor||0));
    if(hf==='prolabore') return hs.some(h=>h.tipo==='proLabore'&&getPago(h)<(h.valor||0));
    if(hf==='exito') return hs.some(h=>h.tipo==='exito'&&getPago(h)<(h.valor||0));
    if(hf==='quitados') return hs.length>0&&hs.every(h=>getPago(h)>=(h.valor||0));
    return hs.length>0;
  });

  const proxVenc=getAllProximasParcelas(60);
  const editingC=S.editHonId?S.casos.find(c=>c.id===S.editHonId):null;
  const editingH=editingC&&S.editHonHid?(editingC.honorarios||[]).find(h=>h.id===S.editHonHid):null;

  const HFILTERS=[
    {id:'pendentes',label:'⏳ Pendentes'},
    {id:'prolabore',label:'Pro-labore pendente'},
    {id:'exito',label:'Êxito pendente'},
    {id:'quitados',label:'✓ Quitados'},
    {id:'todos',label:'Todos'},
  ];

  // ── Mini resumo do painel de honorários do drawer aberto
  function honDrawerCard(c){
    const hs=c.honorarios||[];
    const pl=hs.filter(h=>h.tipo==='proLabore');
    const ex=hs.filter(h=>h.tipo==='exito');
    const plRest=pl.reduce((s,h)=>s+(h.valor||0)-getPago(h),0);
    const exRest=ex.reduce((s,h)=>s+(h.valor||0)-getPago(h),0);
    const proxAberta=proxVenc.find(x=>x.casoId===c.id);
    return`<div class="ccard${plRest>0||exRest>0?'':' v-car'}" style="cursor:pointer;border-left:3px solid ${plRest<=0&&exRest<=0?'var(--grn)':'var(--ora)'}" onclick="openDrawer('${c.id}','caso')">
      <div class="ccard-top">
        <div class="ccard-name">${c.client}</div>
        <span style="font-size:11px;font-weight:600;color:${plRest>0||exRest>0?'var(--ora)':'var(--grn)'}">${plRest>0||exRest>0?fCur(plRest+exRest)+' pendente':'✓ Quitado'}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">
        <div style="background:#f8f7f4;border-radius:var(--r);padding:8px 10px">
          <div style="font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px">Pro-labore</div>
          ${pl.length?`<div style="font-size:13px;font-weight:600;color:${plRest>0?'var(--ora)':'var(--grn)'}">${fCur(plRest)}</div>
          <div style="font-size:10px;color:var(--muted)">${fCur(pl.reduce((s,h)=>s+getPago(h),0))} recebido de ${fCur(pl.reduce((s,h)=>s+(h.valor||0),0))}</div>`:`<div style="font-size:11px;color:var(--faint)">—</div>`}
        </div>
        <div style="background:#f8f7f4;border-radius:var(--r);padding:8px 10px">
          <div style="font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px">Êxito</div>
          ${ex.length?`<div style="font-size:13px;font-weight:600;color:${exRest>0?'var(--blu)':'var(--grn)'}">${fCur(exRest)}</div>
          <div style="font-size:10px;color:var(--muted)">${fCur(ex.reduce((s,h)=>s+getPago(h),0))} recebido de ${fCur(ex.reduce((s,h)=>s+(h.valor||0),0))}</div>`:`<div style="font-size:11px;color:var(--faint)">—</div>`}
        </div>
      </div>
      ${proxAberta?`<div style="margin-top:8px;padding:6px 10px;background:var(--ora-bg);border:1px solid var(--ora-b);border-radius:var(--r);display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:10px;color:var(--ora);font-weight:500">Próxima parcela${proxAberta.parcela.vencimento?' — '+fDate(proxAberta.parcela.vencimento):''}</span>
        <span style="font-size:12px;font-weight:600;color:var(--ora)">${fCur(proxAberta.parcela.valor)}</span>
      </div>`:''}
      ${(c.tagIds||[]).map(id=>tagPill(id)).join('')?`<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:3px" onclick="event.stopPropagation()">${(c.tagIds||[]).map(id=>tagPill(id)).join('')}</div>`:''}
    </div>`;
  }

  return`${tagFilterBanner()}

<!-- LAYOUT: LEFT=lista clicável, RIGHT=resumo financeiro sticky -->
<div style="display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start">

<!-- COLUNA ESQUERDA: cards de casos -->
<div>
<div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
  ${HFILTERS.map(f=>`<button class="fbtn${hf===f.id?' on':''}" onclick="setHonFilter('${f.id}')">${f.label}</button>`).join('')}
  <span style="font-size:11px;color:var(--muted)">${casosVisiveis.length} caso${casosVisiveis.length!==1?'s':''}</span>
</div>
${editingC&&editingH?`<div class="hedit" style="margin-bottom:16px">
<div class="hedit-lbl">Editando: ${editingC.client} — ${editingH.tipo==='proLabore'?'Pro-labore':'Êxito'}</div>
<div class="fgrid">
  <div class="fg"><label>Tipo</label><select id="he-t"><option value="proLabore" ${editingH.tipo==='proLabore'?'selected':''}>Pro-labore</option><option value="exito" ${editingH.tipo==='exito'?'selected':''}>Êxito</option></select></div>
  ${editingH.tipo==='exito'?`<div class="fg"><label>Cálculo</label><select id="he-ct"><option value="fixo" ${(editingH.calcTipo||'fixo')==='fixo'?'selected':''}>Valor fixo</option><option value="percentual" ${editingH.calcTipo==='percentual'?'selected':''}>Percentual</option></select></div>`:'<div></div>'}
  <div class="fg"><label>${editingH.calcTipo==='percentual'?'Meu %':'Valor total (R$)'}</label><input id="he-v" type="number" value="${editingH.calcTipo==='percentual'?editingH.percentualCausa||0:editingH.valor||0}"></div>
  ${editingH.calcTipo==='percentual'?`<div class="fg"><label>Valor da causa (R$)</label><input id="he-causa" type="number" value="${editingH.valorCausa||0}"></div>`:''}
  <div class="fg"><label>Follow-up</label><input id="he-fu" type="date" value="${editingH.followupDate||''}"></div>
  <div class="fg full"><label>Observações</label><textarea id="he-obs" rows="2" style="resize:vertical">${esc(editingH.obs)}</textarea></div>
</div>
${editingH.tipo==='exito'?`<div style="margin-top:10px;padding:10px;background:var(--ora-bg);border:1px solid var(--ora-b);border-radius:var(--r)">
  <label style="font-size:11px;color:var(--ora);font-weight:600">Gatilho do êxito</label>
  <input id="he-gatilho" value="${esc(editingH.gatilho)}" placeholder="Ex: Transitado em julgado..." style="margin-top:5px;width:100%;padding:7px 10px;border:1px solid var(--ora-b);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:12px">
</div>`:''}
${editingH.tipo==='exito'?`<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><label style="font-size:11px;color:var(--muted);font-weight:500">Parceiros</label><button type="button" class="btn btn-ghost btn-sm" onclick="heAddParceiro()">+ Parceiro</button></div>
  <div id="he-parceiros-list">${(editingH.parceiros||[]).map((p,i)=>`<div style="display:grid;grid-template-columns:1fr 100px 32px;gap:6px;margin-bottom:6px;align-items:center"><input placeholder="Nome" value="${esc(p.nome)}" id="hep-n-${i}" style="padding:6px 8px;border:1px solid var(--border2);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:12px"><div style="position:relative"><input type="number" placeholder="%" value="${p.pct||0}" id="hep-p-${i}" min="0" max="100" style="padding:6px 8px;border:1px solid var(--border2);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:12px;width:100%"><span style="position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted)">%</span></div><button type="button" onclick="this.closest('div[style]').remove()" style="background:var(--red-bg);border:1px solid var(--red-b);border-radius:var(--r);color:var(--red);cursor:pointer;font-size:14px;height:32px">×</button></div>`).join('')}</div>
</div>`:''}
<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><label style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px">Parcelas</label><button type="button" class="btn btn-ghost btn-sm" onclick="heAddParcelaRow()">+ Parcela</button></div>
  <div id="he-parcelas-list">${(editingH.parcelas||[]).map((p,i)=>`<div style="display:grid;grid-template-columns:1fr 110px 130px auto 32px;gap:5px;margin-bottom:5px;align-items:center"><input value="${esc(p.descricao)}" id="hpl-d-${i}" placeholder="Descrição" style="padding:5px 8px;border:1px solid var(--border2);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:11px"><input type="number" value="${p.valor||0}" id="hpl-v-${i}" style="padding:5px 8px;border:1px solid var(--border2);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:11px"><input type="date" value="${p.vencimento||''}" id="hpl-venc-${i}" style="padding:5px 8px;border:1px solid var(--border2);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:11px"><label style="font-size:10px;display:flex;align-items:center;gap:3px;cursor:pointer"><input type="checkbox" id="hpl-p-${i}" ${p.pago?'checked':''} style="accent-color:var(--grn)"> Pago</label><button type="button" onclick="this.closest('div[style]').remove()" style="background:var(--red-bg);border:1px solid var(--red-b);border-radius:var(--r);color:var(--red);cursor:pointer;font-size:14px;height:29px">×</button></div>`).join('')}</div>
</div>
<div class="factions"><button class="btn btn-ghost" onclick="cancelHonEdit()">Cancelar</button><button class="btn btn-pri" onclick="saveHonEdit()">Salvar alterações</button></div>
</div>`:''}
${casosVisiveis.length===0?`<div class="empty">Nenhum caso com honorários neste filtro.</div>`:''}
<div class="casos-grid" style="grid-template-columns:1fr">
${casosVisiveis.map(c=>honDrawerCard(c)).join('')}
</div>
</div>

<!-- COLUNA DIREITA: painel financeiro -->
<div style="position:sticky;top:80px">
  <div style="background:var(--navy);border-radius:var(--rl);padding:18px 20px;color:#fff">
    <div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;opacity:.5;margin-bottom:12px">Resumo financeiro</div>

    <div style="margin-bottom:14px">
      <div style="font-size:10px;opacity:.5;margin-bottom:2px">Total contratado</div>
      <div style="font-size:18px;font-weight:700">${fCur(gTotal)}</div>
      <div style="height:4px;background:rgba(255,255,255,.12);border-radius:2px;margin-top:6px"><div style="height:100%;border-radius:2px;background:#86efac;width:${gPct}%"></div></div>
      <div style="font-size:10px;opacity:.5;margin-top:3px">${gPct}% recebido</div>
    </div>

    <div style="border-top:1px solid rgba(255,255,255,.1);padding-top:12px;margin-bottom:14px">
      <div style="font-size:10px;opacity:.5;margin-bottom:2px">Já recebido</div>
      <div style="font-size:16px;font-weight:600;color:#86efac">${fCur(gPago)}</div>
    </div>

    <div style="border-top:1px solid rgba(255,255,255,.1);padding-top:12px;margin-bottom:10px">
      <div style="font-size:10px;opacity:.5;margin-bottom:6px">A receber por tipo</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="background:rgba(255,255,255,.07);border-radius:var(--r);padding:10px 12px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <span style="font-size:10px;font-weight:600;opacity:.7;text-transform:uppercase;letter-spacing:.4px">Pro-labore</span>
            <span style="font-size:15px;font-weight:700;color:#fde68a">${fCur(gPL-gPLpago)}</span>
          </div>
          <div style="font-size:10px;opacity:.45">${fCur(gPLpago)} recebido · ${fCur(gPL)} contratado</div>
          <div style="height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:6px"><div style="height:100%;border-radius:2px;background:#fde68a;width:${gPL>0?Math.min(100,Math.round(gPLpago/gPL*100)):0}%"></div></div>
        </div>
        <div style="background:rgba(255,255,255,.07);border-radius:var(--r);padding:10px 12px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <span style="font-size:10px;font-weight:600;opacity:.7;text-transform:uppercase;letter-spacing:.4px">Êxito</span>
            <span style="font-size:15px;font-weight:700;color:#93c5fd">${fCur(gEx-gExpago)}</span>
          </div>

// ─── PROSPECÇÃO ────────────────────────────────────────
// Stage color/label helpers
const STAGE_COLOR={
  a_contatar:{fg:'var(--muted)',  bg:'#f1f5f9',    bd:'var(--border2)'},
  contato:   {fg:'var(--blu)',    bg:'var(--blu-bg)',bd:'var(--blu-b)'},
  analise:   {fg:'var(--ora)',    bg:'var(--ora-bg)',bd:'var(--ora-b)'},
  pesquisa:  {fg:'var(--car)',    bg:'var(--car-bg)',bd:'var(--car-b)'},
  proposta:  {fg:'var(--navy)',   bg:'#eef0f6',    bd:'var(--car-b)'},
  aguardando:{fg:'var(--amb)',    bg:'var(--amb-bg)',bd:'var(--amb-b)'},
  fechado:   {fg:'var(--grn)',    bg:'var(--grn-bg)',bd:'var(--grn-b)'},
  perdido:   {fg:'var(--red)',    bg:'var(--red-bg)',bd:'var(--red-b)'},
};
function stageChip(id){
  const s=STAGES.find(x=>x.id===id)||{label:id};
  const c=STAGE_COLOR[id]||{fg:'var(--muted)',bg:'#f1f5f9',bd:'var(--border2)'};
  return`<span style="display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600;background:${c.bg};color:${c.fg};border:1px solid ${c.bd}">${s.label}</span>`;
}
function bProsp(){
  const allP=filterByTag(S.prospeccao);
  const hf=S.prospFilter||'ativos';
  // filter
  let list=allP;
  if(hf==='ativos')   list=allP.filter(p=>!['fechado','perdido'].includes(p.stage));
  if(hf==='aguardando')list=allP.filter(p=>p.stage==='aguardando');
  if(hf==='fechado')  list=allP.filter(p=>p.stage==='fechado');
  if(hf==='perdido')  list=allP.filter(p=>p.stage==='perdido');
  // sort: aguardando com followup vencido primeiro, depois por nome
  const now=new Date();
  list=[...list].sort((a,b)=>{
    const afuv=a.followupDate&&new Date(a.followupDate+'T12:00:00')<=now;
    const bfuv=b.followupDate&&new Date(b.followupDate+'T12:00:00')<=now;
    if(afuv&&!bfuv)return-1;if(!afuv&&bfuv)return 1;
    return a.name.localeCompare(b.name,'pt-BR');
  });

  const PFILTERS=[
    {id:'ativos',   label:'Ativos ('+allP.filter(p=>!['fechado','perdido'].includes(p.stage)).length+')'},
    {id:'aguardando',label:'Aguardando'},
    {id:'fechado',  label:'✓ Contrataram'},
    {id:'perdido',  label:'✗ Não contrataram'},
    {id:'todos',    label:'Todos ('+allP.length+')'},
  ];

  return`${tagFilterBanner()}
<div class="top-bar">
  <div class="filters">${PFILTERS.map(f=>`<button class="fbtn${(S.prospFilter||'ativos')===f.id?' on':''}" onclick="S.prospFilter='${f.id}';render()">${f.label}</button>`).join('')}</div>
  <button class="btn-new" onclick="openModal('prosp')">+ Nova prospecção</button>
</div>
${!list.length?`<div class="empty">Nenhuma prospecção neste filtro.</div>`:''}
<div class="casos-grid">
${list.map(p=>{
  const fuVenc=p.followupDate&&new Date(p.followupDate+'T12:00:00')<=now;
  const sc=STAGE_COLOR[p.stage]||STAGE_COLOR.a_contatar;
  const pTags=(p.tagIds||[]).map(id=>tagPill(id)).join('');
  return`<div class="ccard${fuVenc?' v-near':''}" style="border-left-color:${sc.fg};border-left-width:3px" onclick="openDrawer('${p.id}','prosp')">
  <div class="ccard-top">
    <div class="ccard-name">${p.name}</div>
    ${stageChip(p.stage)}
  </div>
  ${p.subject?`<div class="ccard-subj">${p.subject}</div>`:''}
  ${p.notes?`<div class="ccard-next"><div class="ccard-next-lbl">Observações</div><div class="ccard-next-txt">${p.notes.slice(0,100)}${p.notes.length>100?'…':''}</div></div>`:''}
  <div style="display:flex;gap:8px;font-size:10px;color:var(--muted);margin-top:4px;flex-wrap:wrap">
    ${p.lastContact?`<span>Contato: ${fDate(p.lastContact)}</span>`:''}
    ${p.followupDate?`<span style="color:${fuVenc?'var(--red)':'var(--ora)'};font-weight:500">${fuVenc?'⚠ Follow-up vencido':'↻ Follow-up: '+fDate(p.followupDate)}</span>`:''}
  </div>
  ${pTags?`<div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:6px" onclick="event.stopPropagation()">${pTags}</div>`:''}
  <div class="ccard-foot" onclick="event.stopPropagation()" style="margin-top:6px">
    <select style="font-size:10px;padding:2px 5px;border:1px solid var(--border2);border-radius:var(--r);font-family:'DM Sans',sans-serif;background:#f8f7f4" onchange="updSP('${p.id}',this.value)">${STAGES.map(st=>`<option value="${st.id}" ${p.stage===st.id?'selected':''}>${st.label}</option>`).join('')}</select>
    <div><button class="alink del" onclick="delSP('${p.id}')">×</button></div>
  </div>
</div>`;}).join('')}
</div>`;
}

// ══ SAVES ══════════════════════════════════════════════
let _parceiros=[];
let _mParcelas=[];
function honTipoChange(){
  const isExito=gv('mh-t')==='exito';
  document.getElementById('mh-calctipo-wrap').style.display=isExito?'':'none';
  document.getElementById('mh-parceiros-wrap').style.display=isExito?'block':'none';
  const gw=document.getElementById('mh-gatilho-wrap');if(gw)gw.style.display=isExito?'block':'none';
  honCalcChange();
}
function addMParcela(){
  _mParcelas.push({id:uid(),descricao:'',valor:0,vencimento:'',pago:false});
  renderMParcelas();
}
function renderMParcelas(){
  const el=document.getElementById('mh-parcelas-list');if(!el)return;
  el.innerHTML=_mParcelas.map((p,i)=>`
  <div style="display:grid;grid-template-columns:1fr 110px 130px 32px;gap:6px;margin-bottom:6px;align-items:center">
    <input placeholder="Descrição (ex: Parcela 1)" value="${esc(p.descricao)}" oninput="_mParcelas[${i}].descricao=this.value" style="padding:6px 8px;border:1px solid var(--border2);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:12px">
    <input type="number" placeholder="Valor R$" value="${p.valor||''}" oninput="_mParcelas[${i}].valor=parseFloat(this.value)||0" style="padding:6px 8px;border:1px solid var(--border2);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:12px">
    <input type="date" value="${p.vencimento||''}" oninput="_mParcelas[${i}].vencimento=this.value" style="padding:6px 8px;border:1px solid var(--border2);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:12px">
    <button type="button" onclick="_mParcelas.splice(${i},1);renderMParcelas()" style="background:var(--red-bg);border:1px solid var(--red-b);border-radius:var(--r);color:var(--red);cursor:pointer;font-size:14px;height:32px">×</button>
  </div>`).join('');
}
function honCalcChange(){
  const isPct=gv('mh-ct')==='percentual';
  document.getElementById('mh-pct-wrap').style.display=isPct?'':'none';
  document.getElementById('mh-causa-wrap').style.display=isPct?'':'none';
  document.getElementById('mh-total-wrap').style.display=isPct?'':'none';
  honCalcValor();
}
function honCalcValor(){
  const isPct=gv('mh-ct')==='percentual'&&gv('mh-t')==='exito';
  if(isPct){
    const pct=parseFloat(gv('mh-pct'))||0;
    const causa=parseFloat(gv('mh-causa'))||0;
    const total=causa*pct/100;
    const el=document.getElementById('mh-total');if(el){el.value=total.toFixed(2);}
  }
  updateMinhaParte();
}
function addParceiro(){
  _parceiros.push({nome:'',pct:0});
  renderParceirosList();
}
function removeParceiro(i){_parceiros.splice(i,1);renderParceirosList();updateMinhaParte();}
function renderParceirosList(){
  const el=document.getElementById('mh-parceiros-list');if(!el)return;
  el.innerHTML=_parceiros.map((p,i)=>`
    <div style="display:grid;grid-template-columns:1fr 100px 32px;gap:6px;margin-bottom:6px;align-items:center">
      <input placeholder="Nome do parceiro" value="${esc(p.nome)}" oninput="_parceiros[${i}].nome=this.value" style="padding:6px 8px;border:1px solid var(--border2);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:12px">
      <div style="position:relative"><input type="number" placeholder="%" value="${p.pct||''}" min="0" max="100" oninput="_parceiros[${i}].pct=parseFloat(this.value)||0;updateMinhaParte()" style="padding:6px 8px;border:1px solid var(--border2);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:12px;width:100%"><span style="position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted)">%</span></div>
      <button type="button" onclick="removeParceiro(${i})" style="background:var(--red-bg);border:1px solid var(--red-b);border-radius:var(--r);color:var(--red);cursor:pointer;font-size:14px;height:32px">×</button>
    </div>`).join('');
  updateMinhaParte();
}
function updateMinhaParte(){
  const el=document.getElementById('mh-minha-parte');if(!el)return;
  if(!_parceiros.length){el.style.display='none';return;}
  const totalPct=_parceiros.reduce((s,p)=>s+(p.pct||0),0);
  const meuPct=100-totalPct;
  const isPct=gv('mh-ct')==='percentual'&&gv('mh-t')==='exito';
  let valorTotal=isPct?(parseFloat(gv('mh-causa'))||0)*(parseFloat(gv('mh-pct'))||0)/100:(parseFloat(gv('mh-v'))||0);
  const meuValor=valorTotal*meuPct/100;
  el.style.display='';
  el.textContent=`Minha parte: ${meuPct.toFixed(1)}% = ${fCur(meuValor)}${totalPct>100?' ⚠ Total passa de 100%':''}`;
  el.style.color=totalPct>100?'var(--red)':'var(--grn)';
  el.style.borderColor=totalPct>100?'var(--red-b)':'var(--grn-b)';
  el.style.background=totalPct>100?'var(--red-bg)':'var(--grn-bg)';
}

function saveHon(){
  const tipo=gv('mh-t');
  const calcTipo=tipo==='exito'?gv('mh-ct'):'fixo';
  const isPct=calcTipo==='percentual';
  const valorCausa=parseFloat(gv('mh-causa'))||0;
  const percentualCausa=parseFloat(gv('mh-pct'))||0;
  const v=isPct?valorCausa*percentualCausa/100:parseFloat(gv('mh-v'))||0;
  if(!v&&tipo==='proLabore'){alert('Informe o valor contratado');return;}
  const totalPctParceiros=_parceiros.reduce((s,p)=>s+(p.pct||0),0);
  if(totalPctParceiros>100){alert('O total dos parceiros passa de 100%');return;}
  const c=S.casos.find(x=>x.id===_mm.extra);if(!c)return;
  if(!c.honorarios)c.honorarios=[];
  const parcelas=[..._mParcelas.map(p=>({...p,id:p.id||uid()}))];
  const pago=parcelas.filter(p=>p.pago).reduce((s,p)=>s+(p.valor||0),0);
  c.honorarios.push({
    id:uid(),tipo,calcTipo,valor:v,
    percentualCausa:isPct?percentualCausa:0,valorCausa:isPct?valorCausa:0,
    parceiros:[..._parceiros.map(p=>({nome:p.nome,pct:p.pct}))],
    gatilho:tipo==='exito'?gv('mh-gatilho').trim():'',
    gatilhoAtivado:false,gatilhoData:'',
    parcelas,pago,
    followupDate:gv('mh-fu'),obs:gv('mh-obs').trim()
  });
  _parceiros=[];_mParcelas=[];saveData();closeModal();render();
}
function startHonEdit(cid,hid){

}
function toggleParcela(cid,hid,pid,checked){

function ativarGatilho(cid,hid){

function saveHonEdit(){
  const c=S.casos.find(x=>x.id===S.editHonId);if(!c)return;
  const h=(c.honorarios||[]).find(x=>x.id===S.editHonHid);if(!h)return;
  h.tipo=gv('he-t');
  h.calcTipo=h.tipo==='exito'?(gv('he-ct')||'fixo'):'fixo';
  if(h.calcTipo==='percentual'){
    h.percentualCausa=parseFloat(gv('he-v'))||0;
    h.valorCausa=parseFloat(gv('he-causa'))||0;
    h.valor=h.valorCausa*h.percentualCausa/100;
  }else{h.valor=parseFloat(gv('he-v'))||0;h.percentualCausa=0;h.valorCausa=0;}
  h.gatilho=h.tipo==='exito'?gv('he-gatilho').trim():'';
  h.followupDate=gv('he-fu');
  h.obs=gv('he-obs').trim();
  const plist=document.getElementById('he-parceiros-list');
  if(plist){const rows=plist.querySelectorAll('div[style*="grid"]');h.parceiros=[];rows.forEach((row,i)=>{const nome=(row.querySelector(`#hep-n-${i}`)||{}).value||'';const pct=parseFloat((row.querySelector(`#hep-p-${i}`)||{}).value)||0;if(nome||pct)h.parceiros.push({nome,pct});});}
  const hplist=document.getElementById('he-parcelas-list');
  if(hplist){const rows=hplist.querySelectorAll('div[style*="grid"]');h.parcelas=[];rows.forEach((row,i)=>{const desc=(row.querySelector(`#hpl-d-${i}`)||{}).value||'';const val=parseFloat((row.querySelector(`#hpl-v-${i}`)||{}).value)||0;const venc=(row.querySelector(`#hpl-venc-${i}`)||{}).value||'';const pago=(row.querySelector(`#hpl-p-${i}`)||{}).checked||false;h.parcelas.push({id:uid(),descricao:desc,valor:val,vencimento:venc,pago,dataPagamento:pago?new Date().toISOString().slice(0,10):''});});h.pago=h.parcelas.filter(p=>p.pago).reduce((s,p)=>s+(p.valor||0),0);}
  S.editHonId=null;S.editHonHid=null;saveData();render();
}
function delHon(cid,hid){

}
function saveNF(){
  const c=gv('mnf-c').trim();if(!c){alert('Informe o cliente');return;}

function saveLI(){

}

// ── TAG MANAGEMENT ─────────────────────────────────────
let _tagEditColor='blue';
function bTagModal(){
  return`<div style="margin-bottom:16px">
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px">
    ${TAG_COLORS.map(c=>`<div class="tag-color-swatch${_tagEditColor===c.id?' sel':''}" style="background:${c.hex}" onclick="_tagEditColor='${c.id}';document.querySelectorAll('.tag-color-swatch').forEach(el=>el.classList.remove('sel'));this.classList.add('sel')" title="${c.id}"></div>`).join('')}
  </div>
  <div style="display:flex;gap:8px;margin-top:10px">
    <input id="tag-new-lbl" placeholder="Nome da tag (ex: ATN, Contencioso...)" style="flex:1;padding:7px 10px;border:1px solid var(--border2);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:12px">
    <button class="btn btn-pri" onclick="createTag()">+ Criar</button>
  </div>
</div>
<div style="border-top:1px solid var(--border);padding-top:12px">
  <p class="sec-title" style="margin-bottom:10px">Tags existentes</p>
  ${S.tags.map(t=>{const col=getColor(t.color);return`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">
    <span class="tag-pill" style="color:${col.hex};background:${col.bg};border-color:${col.bd};cursor:default">${t.label}</span>
    <span style="font-size:10px;color:var(--muted);flex:1">
      ${S.casos.filter(c=>(c.tagIds||[]).includes(t.id)).length} caso(s) · 
      ${S.prospeccao.filter(p=>(p.tagIds||[]).includes(t.id)).length} prospecção(ões)
    </span>
    <button class="alink del" onclick="deleteTag('${t.id}')">Remover</button>
  </div>`;}).join('')}
</div>`;
}
function createTag(){
  const lbl=gv('tag-new-lbl').trim();if(!lbl){alert('Informe o nome da tag');return;}
  if(S.tags.find(t=>t.label.toLowerCase()===lbl.toLowerCase())){alert('Tag já existe');return;}
  S.tags.push({id:'tag-'+uid(),label:lbl,color:_tagEditColor});
  saveData();
  document.getElementById('modal-body').innerHTML=bTagModal();
}
function deleteTag(id){
  if(!confirm('Remover esta tag?'))return;
  S.tags=S.tags.filter(t=>t.id!==id);
  S.casos.forEach(c=>{if(c.tagIds)c.tagIds=c.tagIds.filter(tid=>tid!==id);});
  S.prospeccao.forEach(p=>{if(p.tagIds)p.tagIds=p.tagIds.filter(tid=>tid!==id);});
  if(S.activeTagFilter===id)S.activeTagFilter=null;
  saveData();
  document.getElementById('modal-body').innerHTML=bTagModal();
}

function exportResume(){
  const lines=['=== ESTADO ATUAL — ESCRITÓRIO DIGITAL ===','','CASOS ATIVOS:'];
  S.casos.filter(c=>c.status!=='encerrado').forEach(c=>{
    lines.push('• '+c.client+' ['+sLabel(c.status)+']'+(c.tribunal?' — '+c.tribunal:'')+(c.processNumber?' ('+c.processNumber+')':''));
    if(c.nextSteps)lines.push('  → '+c.nextSteps.slice(0,120));
  });
  lines.push('','PROSPECÇÕES ATIVAS:');
  S.prospeccao.filter(p=>!['fechado','perdido'].includes(p.stage)).forEach(p=>{
    lines.push('• '+p.name+' ['+STAGES.find(s=>s.id===p.stage)?.label+']'+(p.subject?' — '+p.subject:''));
  });
  const txt=lines.join('\n');
  navigator.clipboard.writeText(txt).then(()=>alert('Copiado! Cole no Claude para sincronizar.')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('Copiado!');
  });
}

function migrate(){
  const carIds={c03:true,c14:true,c15:true};
  let changed=false;
  S.casos.forEach(c=>{
    if(carIds[c.id]&&c.group!=='carneiros'){c.group='carneiros';changed=true;}
    if(!c.tagIds)c.tagIds=[];
    if(carIds[c.id]&&!c.tagIds.includes('tag-car')){c.tagIds.push('tag-car');changed=true;}
    // Garantir que honorarios tenham parcelas array
    (c.honorarios||[]).forEach(h=>{if(!h.parcelas)h.parcelas=[];});
  });
  S.prospeccao.forEach(p=>{if(!p.tagIds)p.tagIds=[];});
  if(changed)saveLocal();
}
async function init(){loadLocal();migrate();render();await syncFromSheet();}
window.addEventListener('resize',setTop);
init();
</script>
