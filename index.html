<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marquez Advogados</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --paper:#efeee9;--paper2:#e7e5de;--surface:#fff;
  --ink:#1b2a4a;--ink2:#263a63;--ink-soft:#3a4a6b;
  --text:#1e2b47;--muted:#647089;--faint:#98a1b4;
  --line:rgba(27,42,74,.09);--line2:rgba(27,42,74,.18);
  --red:#c0322b;--red-bg:#fbeceb;--red-b:#f2c4c0;
  --ora:#b45309;--ora-bg:#fdf3e3;--ora-b:#f2d9a8;
  --grn:#15803d;--grn-bg:#eaf6ee;--grn-b:#bbe3c6;
  --blu:#1d4ed8;--blu-bg:#e8eefc;--blu-b:#bcccf5;
  --car:#3b5ea6;--car-bg:#e9eef8;--car-b:#bccbe9;
  --amb:#92400e;
  --jud:#a01a12;--jud-bg:#f7e4e2;--jud-b:#e6b4ae;
  --r:7px;--rl:11px;--rx:16px;
  --sh:0 1px 2px rgba(27,42,74,.05);
  --sh2:0 6px 22px rgba(27,42,74,.13);
}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--text);font-size:13.5px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;}
a{color:var(--blu);text-decoration:none;}a:hover{text-decoration:underline;}
.mono{font-family:'DM Mono',monospace;font-feature-settings:"tnum";letter-spacing:-.2px;}
::-webkit-scrollbar{width:9px;height:9px;}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;}::-webkit-scrollbar-track{background:transparent;}

/* ── UPDATE BAR ─────────────────────────────── */
#ubar{position:fixed;top:0;left:0;right:0;z-index:200;background:var(--ink);box-shadow:0 1px 14px rgba(0,0,0,.28);}
#utoggle{width:100%;padding:8px 18px;background:transparent;border:none;color:#fff;font-family:inherit;font-size:11.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:space-between;letter-spacing:.2px;}
#utoggle:hover{background:var(--ink2);}
#upanel{padding:10px 18px 14px;border-top:1px solid rgba(255,255,255,.1);display:none;}
#ucmd{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:var(--r);color:#fff;font-family:'DM Mono',monospace;font-size:12px;padding:11px 13px;resize:vertical;min-height:78px;outline:none;line-height:1.6;}
#ucmd::placeholder{color:rgba(255,255,255,.34);}
#ucmd:focus{border-color:rgba(255,255,255,.42);background:rgba(255,255,255,.11);}
#uactions{display:flex;gap:8px;margin-top:8px;align-items:center;}
#ufeedback{font-size:11px;color:#8fe3a8;flex:1;}
.btn-apply{padding:8px 20px;background:#fff;color:var(--ink);border:none;border-radius:var(--r);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;}
.btn-apply:hover{background:#dbe3ef;}
.btn-uhelp{padding:8px 11px;background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:var(--r);color:rgba(255,255,255,.68);font-family:inherit;font-size:11px;cursor:pointer;}
.btn-uhelp:hover{border-color:rgba(255,255,255,.4);color:#fff;}

/* ── MODAIS ─────────────────────────────────── */
.modal-bg{display:none;position:fixed;inset:0;z-index:300;background:rgba(20,28,48,.5);backdrop-filter:blur(2px);align-items:center;justify-content:center;padding:16px;}
.modal-bg.open{display:flex;}
.modal-box{background:var(--surface);border-radius:var(--rx);padding:22px 24px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:var(--sh2);}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-hdr h3{font-size:15px;font-weight:600;}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1;}
.modal-close:hover{color:var(--ink);}

/* ── SHELL ──────────────────────────────────── */
#app{max-width:1440px;margin:0 auto;padding:16px 22px 40px;}
#hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
#hdr h1{font-size:19px;font-weight:600;letter-spacing:-.3px;}
#hdr .sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
#hdr-right{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
#sync-badge{font-size:11px;color:var(--faint);margin-right:2px;}
.hdr-btn{padding:7px 12px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:11.5px;cursor:pointer;color:var(--ink-soft);font-weight:500;box-shadow:var(--sh);}
.hdr-btn:hover{background:var(--paper2);}
.alert-pill{padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;}
.pill-red{background:var(--jud-bg);color:var(--jud);border:1px solid var(--jud-b);}
.pill-grn{background:var(--grn-bg);color:var(--grn);border:1px solid var(--grn-b);}

/* ── TABS ───────────────────────────────────── */
#tabs{display:flex;gap:3px;margin-bottom:18px;border-bottom:1px solid var(--line);overflow-x:auto;}
.tab{padding:9px 15px;border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.tab:hover{color:var(--ink);}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600;}
.tab .cnt{font-size:10.5px;background:var(--paper2);color:var(--muted);border-radius:9px;padding:0 6px;font-weight:600;line-height:16px;}
.tab.on .cnt{background:var(--ink);color:#fff;}

/* ── METRICS ────────────────────────────────── */
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:18px;}
.met{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);padding:13px 15px;box-shadow:var(--sh);cursor:pointer;transition:transform .12s,box-shadow .12s;}
.met:hover{transform:translateY(-1px);box-shadow:var(--sh2);}
.met-lbl{font-size:11px;color:var(--muted);font-weight:500;}
.met-val{font-size:23px;font-weight:700;margin-top:3px;letter-spacing:-.5px;}
.met-val .of{font-size:11px;font-weight:400;color:var(--faint);margin-left:4px;letter-spacing:0;}
.met-sub{font-size:10.5px;color:var(--muted);margin-top:2px;}
.met.accent-ora{border-top:2px solid var(--ora);}
.met.accent-blu{border-top:2px solid var(--blu);}

.sec-title{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.sec-hint{font-size:10.5px;color:var(--faint);font-weight:400;}

/* ── PRAZO JUDICIAL — carimbo ───────────────── */
.jud-stamp{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;letter-spacing:.7px;color:var(--jud);background:var(--jud-bg);border:1px solid var(--jud-b);padding:2px 7px;border-radius:4px;text-transform:uppercase;}

/* ── DASHBOARD timeline ─────────────────────── */
.tl{display:flex;flex-direction:column;gap:6px;}
.tl-item{display:flex;gap:12px;align-items:stretch;cursor:pointer;border-radius:var(--rl);padding:11px 14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh);transition:box-shadow .13s,transform .13s;}
.tl-item:hover{box-shadow:var(--sh2);transform:translateY(-1px);}
.tl-jud{background:var(--jud-bg);border-color:var(--jud-b);border-left:4px solid var(--jud);}
.tl-overdue{background:var(--red-bg);border-color:var(--red-b);}
.tl-urgent{background:var(--ora-bg);border-color:var(--ora-b);}
.tl-honor{background:#fbfbf9;}
.tl-bar{width:7px;min-width:7px;border-radius:4px;margin:1px 0;background:var(--line2);}
.tl-jud .tl-bar{background:var(--jud);}.tl-overdue .tl-bar{background:var(--red);}.tl-urgent .tl-bar{background:var(--ora);}.tl-near .tl-bar{background:var(--blu);}.tl-honor .tl-bar{background:var(--grn);}
.tl-c{flex:1;min-width:0;}
.tl-lbl{font-size:10px;font-weight:600;letter-spacing:.3px;margin-bottom:2px;display:flex;align-items:center;gap:6px;}
.tl-jud .tl-lbl{color:var(--jud);}.tl-overdue .tl-lbl{color:var(--red);}.tl-urgent .tl-lbl{color:var(--ora);}.tl-near .tl-lbl{color:var(--blu);}.tl-honor .tl-lbl{color:var(--grn);}
.tl-main{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tl-sub{font-size:11px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tl-r{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:5px;flex-shrink:0;}
.tl-days{font-size:19px;font-weight:700;line-height:1;letter-spacing:-.5px;}
.tl-jud .tl-days,.tl-overdue .tl-days{color:var(--red);}.tl-urgent .tl-days{color:var(--ora);}.tl-near .tl-days{color:var(--blu);}.tl-honor .tl-days{color:var(--grn);}
.mini-cal{font-size:10px;background:var(--surface);border:1px solid var(--line2);border-radius:5px;padding:2px 7px;cursor:pointer;color:var(--muted);font-family:inherit;white-space:nowrap;}
.mini-cal:hover{background:var(--blu-bg);border-color:var(--blu-b);color:var(--blu);}

.pje-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pje-a{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);padding:11px 14px;box-shadow:var(--sh);}
.pje-a:hover{border-color:var(--ink);text-decoration:none;}
.pje-a h4{font-size:12px;font-weight:600;color:var(--ink);}
.pje-a p{font-size:10.5px;color:var(--blu);margin-top:2px;}

/* ── MASTER-DETAIL ──────────────────────────── */
.md{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start;}
.md-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--sh);overflow:hidden;position:sticky;top:70px;max-height:calc(100vh - 88px);display:flex;flex-direction:column;}
.md-search{padding:10px 12px;border-bottom:1px solid var(--line);flex-shrink:0;}
.md-search input{width:100%;padding:8px 11px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:12.5px;outline:none;background:var(--paper);}
.md-search input:focus{border-color:var(--ink);background:#fff;}
.md-rows{overflow-y:auto;flex:1;}
.md-group-h{font-size:10px;font-weight:600;color:var(--faint);letter-spacing:.4px;padding:9px 14px 4px;text-transform:uppercase;position:sticky;top:0;background:var(--surface);z-index:1;}
.md-row{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center;transition:background .1s;}
.md-row:hover{background:var(--paper);}
.md-row.sel{background:var(--blu-bg);box-shadow:inset 3px 0 0 var(--ink);}
.md-row-bar{width:4px;align-self:stretch;border-radius:3px;background:transparent;flex-shrink:0;margin:-2px 0;}
.md-row.has-jud .md-row-bar{background:var(--jud);}
.md-row-c{flex:1;min-width:0;}
.md-row-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.md-row-meta{font-size:10.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.md-row-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
.md-row-days{font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;white-space:nowrap;}
.dd-jud{background:var(--jud-bg);color:var(--jud);border:1px solid var(--jud-b);}
.dd-over{background:var(--red-bg);color:var(--red);}
.dd-urg{background:var(--ora-bg);color:var(--ora);}
.dd-ok{background:var(--paper2);color:var(--muted);}
.md-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* detail pane */
.md-detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--sh);min-height:400px;}
.dt-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);}
.dt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.dt-name{font-size:19px;font-weight:700;letter-spacing:-.4px;line-height:1.2;}
.dt-meta{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.dt-meta .mono{font-size:11px;}
.dt-actions{display:flex;gap:6px;flex-shrink:0;}
.dt-body{padding:16px 20px 22px;}
.dt-sec{margin-bottom:22px;}
.dt-sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.dt-sec-h h4{font-size:12px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px;}
.dt-sec-h h4 .n{font-size:10.5px;color:var(--muted);background:var(--paper2);border-radius:9px;padding:0 6px;font-weight:600;}

/* tarefa rows */
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:var(--r);border:1px solid var(--line);margin-bottom:6px;background:var(--surface);transition:background .1s;}
.task.drag{cursor:grab;}
.task.dragging{opacity:.4;}
.task.t-jud{background:var(--jud-bg);border-color:var(--jud-b);border-left:3px solid var(--jud);}
.task.t-over{background:var(--red-bg);border-color:var(--red-b);}
.task.t-urg{background:var(--ora-bg);border-color:var(--ora-b);}
.task.t-fu{background:var(--car-bg);border-color:var(--car-b);}
.task-chk{width:17px;height:17px;margin-top:1px;cursor:pointer;accent-color:var(--grn);flex-shrink:0;}
.task.t-jud .task-chk{accent-color:var(--jud);}
.task-c{flex:1;min-width:0;}
.task-txt{font-size:12.5px;font-weight:500;line-height:1.4;}
.task-meta{font-size:10.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.task-date{font-weight:600;}
.task-date.over{color:var(--red);}.task-date.urg{color:var(--ora);}.task-date.jud{color:var(--jud);}
.task-x{background:none;border:none;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;padding:0 3px;flex-shrink:0;}
.task-x:hover{color:var(--red);}
.task-add{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;}
.task-add input,.task-add select{padding:6px 9px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:11.5px;outline:none;background:#fff;}
.task-add input:focus{border-color:var(--ink);}
.task-add .ta-txt{flex:1;min-width:130px;}

.hist-item{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px;}
.hist-date{font-size:10.5px;color:var(--faint);font-weight:600;flex-shrink:0;width:66px;}
.hist-txt{flex:1;color:var(--ink-soft);}
.hist-add{display:flex;gap:6px;margin-top:8px;}
.hist-add input{flex:1;padding:6px 9px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:11.5px;outline:none;}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.info-cell{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px 11px;}
.info-cell .k{font-size:9.5px;color:var(--faint);font-weight:600;letter-spacing:.3px;margin-bottom:2px;}
.info-cell .v{font-size:12px;font-weight:500;}
.summary-box{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;font-size:12.5px;line-height:1.6;white-space:pre-wrap;}

/* ── BUTTONS ────────────────────────────────── */
.btn{padding:8px 15px;border-radius:var(--r);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;border:1px solid transparent;}
.btn-pri{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn-pri:hover{background:var(--ink2);}
.btn-ghost{background:var(--surface);color:var(--ink-soft);border-color:var(--line2);}
.btn-ghost:hover{background:var(--paper2);}
.btn-sm{padding:5px 11px;font-size:11px;}
.btn-new{padding:8px 15px;background:var(--ink);color:#fff;border:none;border-radius:var(--r);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;}
.btn-new:hover{background:var(--ink2);}
.iconbtn{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);padding:6px 9px;cursor:pointer;font-size:12px;color:var(--muted);font-family:inherit;}
.iconbtn:hover{background:var(--paper2);color:var(--ink);}
.iconbtn.del:hover{color:var(--red);border-color:var(--red-b);}

/* ── TOP BAR / VIEW TOGGLE ──────────────────── */
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.seg{display:inline-flex;background:var(--paper2);border-radius:var(--r);padding:2px;gap:2px;}
.seg button{padding:6px 13px;border:none;background:transparent;font-family:inherit;font-size:11.5px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:5px;}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh);font-weight:600;}
.filters{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.fbtn{padding:6px 13px;border:1px solid var(--line2);border-radius:20px;background:var(--surface);font-family:inherit;font-size:11.5px;cursor:pointer;color:var(--muted);}
.fbtn:hover{border-color:var(--ink);}
.fbtn.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600;}

/* ── KANBAN ─────────────────────────────────── */
.kb-scroll{overflow-x:auto;padding-bottom:10px;}
.kb{display:flex;gap:13px;min-width:min-content;}
.kb-col{width:270px;flex-shrink:0;}
.kb-col-h{display:flex;align-items:center;gap:7px;margin-bottom:9px;padding:7px 11px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);border-left:3px solid var(--muted);}
.kb-col-h .t{font-size:11px;font-weight:600;letter-spacing:.2px;flex:1;}
.kb-col-h .c{font-size:11px;font-weight:600;color:var(--muted);background:var(--paper2);border-radius:10px;padding:0 8px;line-height:18px;}
.kb-drop{min-height:60px;border-radius:var(--rl);transition:background .12s;padding:2px;}
.kb-drop.over{background:var(--blu-bg);outline:2px dashed var(--blu-b);}
.kb-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);padding:11px 13px;margin-bottom:7px;box-shadow:var(--sh);cursor:grab;border-left:3px solid transparent;transition:box-shadow .12s,transform .12s;}
.kb-card:hover{box-shadow:var(--sh2);}
.kb-card:active{cursor:grabbing;}
.kb-card.dragging{opacity:.45;transform:scale(.98);}
.kb-card.has-jud{border-left-color:var(--jud);}
.kb-card-name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kb-card-meta{font-size:10px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kb-card-jud{margin-top:7px;}
.kb-card-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px;}

/* ── HONORÁRIOS (mantém base) ───────────────── */
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);padding:15px 17px;margin-bottom:11px;box-shadow:var(--sh);}
.hcard-name{font-size:14px;font-weight:600;}
.hdet{border:1px solid var(--line);border-radius:var(--rl);padding:13px;margin-bottom:8px;background:var(--paper);}
.hdet-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.hdet-tipo{font-size:11px;font-weight:600;letter-spacing:.3px;color:var(--ink);}
.hdet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;}
.hdet-field{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;}
.hdet-field-lbl{font-size:9px;color:var(--faint);letter-spacing:.3px;font-weight:600;margin-bottom:2px;}
.hdet-field-val{font-size:12px;font-weight:600;}
.hdet-field-val.grn{color:var(--grn);}.hdet-field-val.red{color:var(--red);}.hdet-field-val.ora{color:var(--ora);}
.hdet-obs{margin-top:8px;font-size:11px;color:var(--muted);font-style:italic;padding:6px 8px;background:#fff;border-radius:var(--r);border:1px solid var(--line);}
.hedit{background:var(--blu-bg);border:1px solid var(--blu-b);border-radius:var(--rl);padding:14px;margin-bottom:8px;}
.hedit-lbl{font-size:11px;font-weight:600;color:var(--blu);letter-spacing:.3px;margin-bottom:10px;}

/* ── FORMS ──────────────────────────────────── */
.fg{display:flex;flex-direction:column;gap:4px;}
.fg label{font-size:11px;color:var(--muted);font-weight:500;}
.fg input,.fg select,.fg textarea{padding:8px 11px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:12.5px;color:var(--text);background:#fff;outline:none;width:100%;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--ink);}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.fgrid .full{grid-column:span 2;}
.factions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
.eform{background:var(--paper);border:1px solid var(--line);border-radius:var(--rl);padding:16px;margin-bottom:16px;}
.eform-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.eform-hdr h3{font-size:13px;font-weight:600;}

/* ── CONTÁBIL / LINKEDIN ────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh);}
.check-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.check-item input{width:16px;height:16px;cursor:pointer;accent-color:var(--ink);flex-shrink:0;}
.check-item label{font-size:13px;cursor:pointer;}
.check-item.done label{text-decoration:line-through;color:var(--muted);}
.das-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;}
.nf-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.lipipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
.licard{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);padding:12px;margin-bottom:6px;box-shadow:var(--sh);}
.licard p{font-size:12.5px;margin-bottom:6px;}
.licard small{font-size:10px;color:var(--muted);}
.licard-foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:5px;}
.licard-foot select{font-size:10.5px;padding:3px 6px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;background:var(--paper);flex:1;}
.pipe-col-h{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.4px;margin-bottom:8px;text-transform:uppercase;}

.empty{text-align:center;padding:44px 20px;color:var(--muted);font-size:13px;}
.empty .big{font-size:15px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
.alink{background:none;border:none;font-family:inherit;font-size:10.5px;color:var(--muted);cursor:pointer;padding:2px 4px;}
.alink:hover{text-decoration:underline;}
.alink.del{color:var(--red);}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:11px;}
.b-info{background:var(--blu-bg);color:var(--blu);}.b-warn{background:var(--ora-bg);color:var(--ora);}
.b-danger{background:var(--red-bg);color:var(--red);}.b-success{background:var(--grn-bg);color:var(--grn);}
.b-muted{background:var(--paper2);color:var(--muted);}
pre{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:11.5px;line-height:1.7;overflow-x:auto;white-space:pre-wrap;font-family:'DM Mono',monospace;}

/* ── TAGS ───────────────────────────────────── */
.tag-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600;border:1px solid;cursor:pointer;white-space:nowrap;}
.tag-pill:hover{opacity:.82;}
.tag-filter-bar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--ink);color:#fff;border-radius:var(--r);margin-bottom:16px;font-size:12px;}
.tag-filter-bar button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:20px;padding:3px 10px;font-size:11px;cursor:pointer;font-family:inherit;}
.tag-filter-bar button:hover{background:rgba(255,255,255,.34);}
.tag-color-swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;}
.tag-color-swatch.sel{border-color:var(--ink);transform:scale(1.15);}

@media(max-width:900px){
  .md{grid-template-columns:1fr;}
  .md-list{position:static;max-height:none;}
  .md-list.hide-mobile{display:none;}
  .md-detail.hide-mobile{display:none;}
  .back-mobile{display:inline-flex!important;}
}
.back-mobile{display:none;align-items:center;gap:5px;background:none;border:none;font-family:inherit;font-size:12px;color:var(--blu);cursor:pointer;margin-bottom:10px;font-weight:600;}
@media(max-width:640px){
  #app{padding:14px 14px 40px;}
  .fgrid,.info-grid,.pje-grid{grid-template-columns:1fr;}
  .fgrid .full{grid-column:span 1;}
  .mets{grid-template-columns:1fr 1fr;}
}

function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function saveLocal(){lsSet('casos',S.casos);lsSet('prospeccao',S.prospeccao);lsSet('linkedin',S.linkedin);lsSet('contabil',S.contabil);lsSet('tags',S.tags);}
function loadLocal(){
  S.casos=lsGet('casos',null);S.prospeccao=lsGet('prospeccao',null);
  S.linkedin=lsGet('linkedin',[]);S.contabil=lsGet('contabil',{});S.tags=lsGet('tags',null);
  if(!S.casos||!S.casos.length){S.casos=JSON.parse(JSON.stringify(SEED_C));S.prospeccao=JSON.parse(JSON.stringify(SEED_P));saveLocal();}
  if(!S.tags||!S.tags.length){S.tags=SEED_TAGS;saveLocal();}
}

// ══ SYNC ═══════════════════════════════════════════════
async function syncFromSheet(){
  setSt('syncing');renderBadge();
  try{
    const r=await fetch(SHEET_URL+'?secret='+SECRET+'&t='+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();if(d.error)throw new Error(d.error);
    if(d.casos&&d.casos.length){
      S.casos=d.casos;
      if(d.prospeccao)S.prospeccao=d.prospeccao;
      if(d.linkedin)S.linkedin=d.linkedin;
      if(d.contabil)S.contabil=d.contabil;
      if(d.tags&&d.tags.length)S.tags=d.tags;else if(!S.tags||!S.tags.length)S.tags=SEED_TAGS;
      migrate();saveLocal();
    }
    setSt('ok');
  }catch(e){console.error(e);setSt('error');}
  renderBadge();render();
}
async function saveData(){
  syncDeadlines();saveLocal();setSt('syncing');renderBadge();
  try{
    const payload={secret:SECRET,casos:S.casos,prospeccao:S.prospeccao,linkedin:S.linkedin,contabil:S.contabil,tags:S.tags};
    await fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:new URLSearchParams({data:JSON.stringify(payload)})});
    setSt('ok');
  }catch(e){setSt('error');}
  renderBadge();
}
function setSt(st){syncSt=st;if(st==='ok')lastSync=new Date();}
function renderBadge(){
  const txt={syncing:'Sincronizando…',ok:'Sincronizado '+(lastSync?lastSync.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''),error:'Erro de sincronização',idle:''}[syncSt];
  const c={syncing:'#93c5fd',ok:'#8fe3a8',error:'#fca5a5',idle:'rgba(255,255,255,.4)'}[syncSt];
  const el=document.getElementById('sync-badge');if(el){el.textContent=txt;el.style.color=c;}
  const el2=document.getElementById('sync-badge-2');if(el2){el2.textContent=txt;el2.style.color=syncSt==='error'?'var(--red)':'var(--faint)';el2.style.fontSize='11px';}
}
async function forceSync(){await syncFromSheet();}

// ══ UTILS ══════════════════════════════════════════════
function uid(){return Math.random().toString(36).substr(2,9);}
function fDate(d){if(!d)return'';try{return new Date(d+'T12:00:00').toLocaleDateString('pt-BR');}catch{return d;}}
function fDateShort(d){if(!d)return'';try{return new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});}catch{return d;}}
function fCur(v){return(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function today0(){const t=new Date();t.setHours(0,0,0,0);return t;}
function daysTo(d){if(!d)return null;return Math.ceil((new Date(d+'T12:00:00')-today0())/864e5);}
function gv(id){const e=document.getElementById(id);return e?e.value:'';}
function parseDate(v){if(/^\d{2}\/\d{2}\/\d{4}$/.test(v)){const[d,m,y]=v.split('/');return y+'-'+m+'-'+d;}return v;}

function sLabel(s){return{em_andamento:'Em andamento',aguardando:'Aguardando',encerrado:'Encerrado',liminar:'Liminar',recurso:'Recurso'}[s]||s||'Em andamento';}
function sBadge(s){return{em_andamento:'b-info',aguardando:'b-warn',encerrado:'b-success',liminar:'b-danger',recurso:'b-muted'}[s]||'b-muted';}

// tarefas helpers
function pendTasks(c){return(c.tarefas||[]).filter(t=>!t.feito);}
function judTasks(c){return pendTasks(c).filter(t=>t.tipo==='prazo'&&t.data);}
// menor prazo judicial pendente (data)
function nextPrazo(c){const j=judTasks(c).map(t=>t.data).filter(Boolean).sort();return j[0]||c.deadline||null;}
function hasPrazoUrg(c){const p=nextPrazo(c);if(!p)return false;const d=daysTo(p);return d!==null&&d<=7;}
// mantém c.deadline espelhando o menor prazo judicial (p/ email/sheet legado)
function syncDeadlines(){S.casos.forEach(c=>{const j=judTasks(c).map(t=>t.data).filter(Boolean).sort();if(j.length)c.deadline=j[0];});}

function getPago(h){const p=h.parcelas||[];if(p.length>0)return p.filter(x=>x.pago).reduce((s,x)=>s+(x.valor||0),0);return h.pago||0;}
function getProximaParcelaAberta(h){const p=[...(h.parcelas||[])].sort((a,b)=>(a.vencimento||'zz').localeCompare(b.vencimento||'zz'));return p.find(x=>!x.pago)||null;}
function getAllProximasParcelas(dias){
  const now=new Date();const res=[];
  S.casos.forEach(c=>(c.honorarios||[]).forEach(h=>{
    const prox=getProximaParcelaAberta(h);
    if(prox&&prox.vencimento){const dl=Math.ceil((new Date(prox.vencimento+'T12:00:00')-now)/864e5);res.push({casoId:c.id,client:c.client,parcela:prox,honorarioId:h.id,tipo:h.tipo,dl});}
    else if(prox){res.push({casoId:c.id,client:c.client,parcela:prox,honorarioId:h.id,tipo:h.tipo,dl:null});}
  }));
  res.sort((a,b)=>a.dl===null?1:b.dl===null?-1:a.dl-b.dl);
  return res;
}

// sort casos: prazo judicial vencido → urgente → futuro → sem prazo → encerrado
function caseSortVal(c){
  if(c.status==='encerrado')return 1e9;
  const p=nextPrazo(c);if(!p)return 5e8;
  const d=daysTo(p);return d;
}
function sortC(l){return[...l].sort((a,b)=>{const av=caseSortVal(a),bv=caseSortVal(b);if(av!==bv)return av-bv;return a.client.localeCompare(b.client,'pt-BR');});}

function gcalLink(title,date,details){
  if(!date)return'';const d=date.replace(/-/g,'');
  const nx=new Date(date+'T12:00:00');nx.setDate(nx.getDate()+1);
  const end=nx.toISOString().slice(0,10).replace(/-/g,'');
  return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('[Escritório] '+title)+'&dates='+d+'/'+end+'&details='+encodeURIComponent(details||'');
}
// evento cobrindo a janela (abertura → fatal); se sem abertura, cai no dia fatal
function gcalWindow(title,inicio,fatal,details){
  if(!fatal)return'';
  if(!inicio)return gcalLink(title,fatal,details);
  const d=inicio.replace(/-/g,'');
  const nx=new Date(fatal+'T12:00:00');nx.setDate(nx.getDate()+1);
  const end=nx.toISOString().slice(0,10).replace(/-/g,'');
  const det=(details?details+' — ':'')+'Janela: '+fDate(inicio)+' até '+fDate(fatal)+' (data fatal)';
  return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('[Escritório] '+title)+'&dates='+d+'/'+end+'&details='+encodeURIComponent(det);
}

// ══ UPDATE BAR ═════════════════════════════════════════
let uOpen=false;
function toggleU(){uOpen=!uOpen;document.getElementById('upanel').style.display=uOpen?'block':'none';document.getElementById('utoggle-lbl').textContent=uOpen?'Fechar':'Colar atualização do Claude';setTop();}
function setTop(){const h=document.getElementById('ubar').offsetHeight;document.getElementById('app').style.paddingTop=(h+16)+'px';}
function showFb(msg,err){const el=document.getElementById('ufeedback');el.textContent=msg;el.style.color=err?'#fca5a5':'#8fe3a8';setTimeout(()=>el.textContent='',4200);}
function applyUpdate(){
  const raw=document.getElementById('ucmd').value.trim();
  if(!raw.toUpperCase().startsWith('UPDATE')){showFb('Deve começar com UPDATE',true);return;}
  const lines=raw.split('\n').slice(1).map(l=>l.trim()).filter(l=>l&&l.includes('→'));
  let ok=0;const errs=[];
  for(const line of lines){
    const[sel,...rest]=line.split('→');const asgn=rest.join('→').trim();
    const ci=asgn.indexOf(':');if(ci<0)continue;
    const field=asgn.slice(0,ci).trim().toLowerCase(),value=asgn.slice(ci+1).trim();
    const slo=sel.trim().toLowerCase();
    if(slo.startsWith('caso:')){
      const q=slo.slice(5).trim();const c=S.casos.find(x=>x.client.toLowerCase().includes(q));
      if(!c){errs.push(q);continue;}applyC(c,field,value);ok++;
    }else if(slo.startsWith('prospecção:')||slo.startsWith('prospeccao:')){
      const q=slo.replace(/prospec[çc][aã]o:/,'').trim();const p=S.prospeccao.find(x=>x.name.toLowerCase().includes(q));
      if(!p){errs.push(q);continue;}applyP(p,field,value);ok++;
    }
  }
  if(ok>0){saveData();render();showFb(ok+' atualização'+(ok>1?'ões':'')+' aplicada'+(ok>1?'s':''));document.getElementById('ucmd').value='';}
  else showFb('Nenhuma atualização'+(errs.length?' — não encontrado: '+errs[0]:''),true);
}
function applyC(c,field,value){
  if(!c.tarefas)c.tarefas=[];if(!c.historico)c.historico=[];
  const sm={'em andamento':'em_andamento','em_andamento':'em_andamento',andamento:'em_andamento',aguardando:'aguardando',encerrado:'encerrado',liminar:'liminar',recurso:'recurso'};
  // tarefa nova: texto | tipo | data   (data pode ser janela: "19/05/2026 a 25/05/2026")
  if(field==='tarefa'){
    const parts=value.split('|').map(s=>s.trim());
    const texto=parts[0]||'';let tipo=(parts[1]||'tarefa').toLowerCase();
    let data='',dataInicio='';
    if(parts[2]){
      const rng=parts[2].split(/\s+(?:a|até|-|—|→)\s+/);
      if(rng.length===2){dataInicio=parseDate(rng[0].trim());data=parseDate(rng[1].trim());}
      else data=parseDate(parts[2]);
    }
    const tipoMap={prazo:'prazo',judicial:'prazo','prazo judicial':'prazo',tarefa:'tarefa',interna:'tarefa',followup:'followup','follow-up':'followup',proposta:'followup',aguardando:'followup'};
    tipo=tipoMap[tipo]||'tarefa';
    if(tipo!=='prazo')dataInicio='';
    if(texto)c.tarefas.push({id:uid(),texto,tipo,data,dataInicio,feito:false,dataFeito:''});
    return;
  }
  // baixa: marca tarefa como feita (busca por texto parcial) e registra no histórico
  if(field==='baixa'||field==='concluir'||field==='feito'){
    const q=value.toLowerCase();const t=c.tarefas.find(x=>!x.feito&&x.texto.toLowerCase().includes(q));
    if(t){t.feito=true;t.dataFeito=new Date().toISOString().slice(0,10);c.historico.unshift({id:uid(),data:t.dataFeito,texto:'✓ '+t.texto});}
    return;
  }
  if(field==='historico'||field==='histórico'||field==='evolucao'||field==='evolução'){
    c.historico.unshift({id:uid(),data:new Date().toISOString().slice(0,10),texto:value});return;
  }
  const fm={status:'status',nextsteps:'nextSteps',providencias:'nextSteps','providências':'nextSteps',resumo:'nextSteps',deadline:'deadline',prazo:'deadline',processnumber:'processNumber',processo:'processNumber',subject:'subject',assunto:'subject',tribunal:'tribunal'};
  const f=fm[field]||field;
  if(f==='status')c.status=sm[value.toLowerCase()]||value;
  else if(f==='deadline'){const dt=parseDate(value);c.tarefas.push({id:uid(),texto:'Prazo judicial',tipo:'prazo',data:dt,feito:false,dataFeito:''});}
  else if(f in c)c[f]=value;
}
function applyP(p,field,value){
  const fm={stage:'stage','estágio':'stage',estagio:'stage',notes:'notes',subject:'subject',assunto:'subject',followup:'followupDate',lastcontact:'lastContact'};
  const sm={'a contatar':'a_contatar',a_contatar:'a_contatar','contato feito':'contato',contato:'contato','análise':'analise',analise:'analise','em análise':'analise',pesquisa:'pesquisa','due diligence':'pesquisa','proposta enviada':'proposta',proposta:'proposta','aguardando retorno':'aguardando',aguardando:'aguardando',contratou:'fechado',fechado:'fechado','não contratou':'perdido',perdido:'perdido'};
  const f=fm[field.toLowerCase()]||field;
  if(f==='stage')p.stage=sm[value.toLowerCase()]||value;
  else if(f==='followupDate'||f==='lastContact')p[f]=parseDate(value);
  else if(f in p)p[f]=value;
}

  <div class="met" onclick="setTab('prospeccao')"><div class="met-lbl">Prospecções ativas</div><div class="met-val">${pend}<span class="of">/ ${S.prospeccao.length}</span></div></div>
  <div class="met accent-ora" onclick="setTab('honorarios')"><div class="met-lbl">A receber — pro-labore</div><div class="met-val" style="font-size:17px;color:var(--ora)">${fCur(tPL-pPL)}</div><div class="met-sub">${fCur(pPL)} de ${fCur(tPL)}</div></div>
  <div class="met accent-blu" onclick="setTab('honorarios')"><div class="met-lbl">A receber — êxito</div><div class="met-val" style="font-size:17px;color:var(--blu)">${fCur(tEx-pEx)}</div><div class="met-sub">${fCur(pEx)} de ${fCur(tEx)}</div></div>
</div>

<div style="margin-bottom:22px">
  <div class="sec-title">⚖ Prazos judiciais <span class="sec-hint">— prioridade máxima · clique para abrir o caso</span></div>
  <div class="tl">${judHtml}</div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:22px">
  <div>
    <div class="sec-title">Agenda de tarefas e cobranças <span class="sec-hint">60 dias</span></div>
    <div class="tl">${outrosHtml}</div>
  </div>
  <div>
    <div class="sec-title">Prospecção — proposta enviada / aguardando <span class="sec-hint">${propostas.length}</span></div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:18px">
      ${propostas.length?propostas.map(p=>{const fuV=p.followupDate&&daysTo(p.followupDate)<=0;return`<div class="tl-item" style="padding:9px 13px" onclick="goProsp('${p.id}')"><div class="tl-bar" style="background:${p.stage==='proposta'?'var(--car)':'var(--amb)'}"></div><div class="tl-c"><div class="tl-lbl" style="color:${p.stage==='proposta'?'var(--car)':'var(--amb)'}">${p.stage==='proposta'?'Proposta enviada':'Aguardando retorno'}</div><div class="tl-main" style="font-size:12.5px">${p.name}</div>${p.subject?`<div class="tl-sub">${esc(p.subject)}</div>`:''}</div>${p.followupDate?`<div class="tl-r"><span style="font-size:10.5px;font-weight:600;color:${fuV?'var(--red)':'var(--ora)'}">${fuV?'follow-up!':fDateShort(p.followupDate)}</span></div>`:''}</div>`;}).join(''):`<p style="font-size:12px;color:var(--muted)">Nenhuma proposta pendente de retorno.</p>`}
    </div>
    <div class="sec-title">Monitoramento PJe</div>
    <div class="pje-grid">${PJE.map(l=>`<a class="pje-a" href="${l.url}" target="_blank"><h4>${l.label}</h4><p>Ver publicações</p></a>`).join('')}</div>
  </div>
</div>

${semData.length?`<div style="margin-bottom:10px">
  <div class="sec-title">Providências sem data marcada <span class="sec-hint">clique para abrir e dar baixa</span></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px">
    ${semData.map(({c,tf})=>`<div class="tl-item" style="padding:10px 13px;align-items:flex-start" onclick="goCaso('${c.id}')"><div class="tl-bar" style="background:var(--line2)"></div><div class="tl-c"><div class="tl-main" style="font-size:12.5px">${c.client}</div>${tf.slice(0,3).map(t=>`<div class="tl-sub" style="white-space:normal">• ${esc(t.texto)}</div>`).join('')}${tf.length>3?`<div class="tl-sub">+${tf.length-3} mais</div>`:''}</div></div>`).join('')}
  </div>
</div>`:''}`;
}
function goCaso(id){S.tab='casos';S.selCaso=id;S.mobileDetail=true;S.casosView='lista';render();window.scrollTo(0,0);}
function goProsp(id){S.tab='prospeccao';S.selProsp=id;S.mobileDetail=true;S.prospView='lista';render();window.scrollTo(0,0);}

// ─── CASOS: master-detail + kanban ─────────────────────
const CASO_COLS=[
  {id:'em_andamento',label:'Em andamento',color:'var(--blu)'},
  {id:'liminar',label:'Liminar',color:'var(--red)'},
  {id:'recurso',label:'Recurso',color:'var(--car)'},
  {id:'aguardando',label:'Aguardando',color:'var(--ora)'},
  {id:'encerrado',label:'Encerrado',color:'var(--grn)'},
];
function casoMatchesSearch(c){
  if(!S.search)return true;const q=S.search.toLowerCase();
  return c.client.toLowerCase().includes(q)||(c.subject||'').toLowerCase().includes(q)||(c.processNumber||'').toLowerCase().includes(q)||(c.tribunal||'').toLowerCase().includes(q);
}
function casoFilterList(){
  let base=filterByTag(S.casos).filter(casoMatchesSearch);
  if(S.filter==='ativos')base=base.filter(c=>c.status!=='encerrado');
  else if(S.filter==='judicial')base=base.filter(c=>c.type==='judicial');
  else if(S.filter==='consultivo')base=base.filter(c=>c.type==='consultivo');
  else if(S.filter==='prazos')base=base.filter(c=>judTasks(c).length>0);
  return base;
}
function bCasos(){
  const list=sortC(casoFilterList());
  // seleção default = primeiro da lista
  if(!S.selCaso||!list.find(c=>c.id===S.selCaso)){S.selCaso=list.length?list[0].id:null;}
  const view=S.casosView||'lista';

  const FILTERS=[{id:'ativos',label:'Ativos'},{id:'todos',label:'Todos'},{id:'prazos',label:'⚖ Com prazo'},{id:'judicial',label:'Judiciais'},{id:'consultivo',label:'Consultivos'}];
  const bar=`${tagFilterBanner()}<div class="top-bar">
    <div class="filters">${FILTERS.map(f=>`<button class="fbtn${S.filter===f.id?' on':''}" onclick="setFilter('${f.id}')">${f.label}</button>`).join('')}</div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="seg"><button class="${view==='lista'?'on':''}" onclick="S.casosView='lista';render()">Lista + detalhe</button><button class="${view==='kanban'?'on':''}" onclick="S.casosView='kanban';render()">Quadro</button></div>
      <button class="btn-new" onclick="openModal('caso')">+ Novo caso</button>
    </div>
  </div>`;

  if(view==='kanban'){
    const cols=CASO_COLS;
    return bar+`<div class="kb-scroll"><div class="kb">${cols.map(col=>{
      const cards=sortC(list.filter(c=>c.status===col.id));
      return`<div class="kb-col"><div class="kb-col-h" style="border-left-color:${col.color}"><span class="t" style="color:${col.color}">${col.label}</span><span class="c">${cards.length}</span></div>
      <div class="kb-drop" data-status="${col.id}">${cards.map(c=>kbCard(c)).join('')||''}</div></div>`;
    }).join('')}</div></div>`;
  }

  // LISTA + DETALHE
  const sel=S.selCaso?S.casos.find(c=>c.id===S.selCaso):null;
  const hideList=S.mobileDetail?'hide-mobile':'';
  const hideDetail=S.mobileDetail?'':'hide-mobile';
  return bar+`<div class="md">
    <div class="md-list ${hideList}">
      <div class="md-search"><input placeholder="Buscar caso, cliente, processo…" value="${esc(S.search)}" oninput="S.search=this.value;rerenderCasos()"></div>
      <div class="md-rows">${list.length?list.map(c=>caseRow(c)).join(''):`<div class="empty" style="padding:26px">Nenhum caso neste filtro.</div>`}</div>
    </div>
    <div class="md-detail ${hideDetail}">
      <button class="back-mobile" onclick="S.mobileDetail=false;render()">‹ Voltar à lista</button>
      ${sel?caseDetail(sel):`<div class="empty" style="padding:60px"><div class="big">Selecione um caso</div>Escolha um caso na lista para ver os detalhes.</div>`}
    </div>
  </div>`;
}
function rerenderCasos(){
  // atualiza só a lista sem perder foco do input
  const list=sortC(casoFilterList());
  const el=document.querySelector('.md-rows');if(el)el.innerHTML=list.length?list.map(c=>caseRow(c)).join(''):`<div class="empty" style="padding:26px">Nenhum caso neste filtro.</div>`;
}
function setFilter(f){S.filter=f;S.selCaso=null;render();}
function selectCaso(id){S.selCaso=id;S.mobileDetail=true;render();}

function caseRow(c){
  const sel=S.selCaso===c.id;const p=nextPrazo(c);const d=p?daysTo(p):null;
  const hasJud=judTasks(c).length>0;
  let ddCls='dd-ok',ddTxt='';
  if(d!==null){if(hasJud&&d<=7){ddCls=d<0?'dd-over':'dd-jud';ddTxt=d<0?Math.abs(d)+'d':d+'d';}else if(d<0){ddCls='dd-over';ddTxt='atr.';}else if(d<=7){ddCls='dd-urg';ddTxt=d+'d';}else{ddCls='dd-ok';ddTxt=fDateShort(p);}}
  const nPend=pendTasks(c).length;
  const dotColor={em_andamento:'var(--blu)',aguardando:'var(--ora)',liminar:'var(--red)',recurso:'var(--car)',encerrado:'var(--grn)'}[c.status]||'var(--muted)';
  return`<div class="md-row ${sel?'sel':''} ${hasJud?'has-jud':''}" onclick="selectCaso('${c.id}')">
    <div class="md-row-bar"></div>
    <div class="md-dot" style="background:${dotColor}"></div>
    <div class="md-row-c">
      <div class="md-row-name">${c.client}</div>
      <div class="md-row-meta">${c.type==='consultivo'?'Consultivo':(c.tribunal||'Judicial')}${nPend?' · '+nPend+' pendente'+(nPend>1?'s':''):''}</div>
    </div>
    <div class="md-row-r">
      ${d!==null?`<span class="md-row-days ${ddCls}">${hasJud&&d<=7?'⚖ ':''}${ddTxt}</span>`:''}
      ${(c.tagIds||[]).length?`<div style="display:flex;gap:2px">${(c.tagIds||[]).slice(0,2).map(id=>{const t=getTag(id);if(!t)return'';const col=getColor(t.color);return`<span style="width:8px;height:8px;border-radius:50%;background:${col.hex}" title="${t.label}"></span>`;}).join('')}</div>`:''}
    </div>
  </div>`;
}

// ── DETALHE do caso ────────────────────────────────────
function caseDetail(c){
  const tUrl=c.tribunal&&TRIBUNAIS[c.tribunal]?TRIBUNAIS[c.tribunal]:null;
  const tarefas=c.tarefas||[];
  // ordenar: prazo judicial primeiro, depois por data, depois sem data; feitos ao fim
  const ord=(a,b)=>{if(a.feito!==b.feito)return a.feito?1:-1;const pa=a.tipo==='prazo'?0:1,pb=b.tipo==='prazo'?0:1;if(pa!==pb)return pa-pb;return(a.data||'zzzz').localeCompare(b.data||'zzzz');};
  const tks=[...tarefas].sort(ord);
  const pend=tks.filter(t=>!t.feito),done=tks.filter(t=>t.feito);
  const hist=(c.historico||[]);
  const hons=c.honorarios||[];
  let hRest=0;hons.forEach(h=>hRest+=(h.valor||0)-getPago(h));

  return`
<div class="dt-head">
  <div class="dt-top">
    <div>
      <div class="dt-name">${c.client}</div>
      <div class="dt-meta">
        <span class="badge ${sBadge(c.status)}">${sLabel(c.status)}</span>
        <span>${c.type==='consultivo'?'Consultivo':'Judicial'}</span>
        ${c.tribunal?`<span>·</span><span>${tUrl?`<a href="${tUrl}" target="_blank">${c.tribunal} ↗</a>`:c.tribunal}</span>`:''}
        ${c.processNumber?`<span>·</span><span class="mono">${c.processNumber}</span>`:''}
        ${c.group==='carneiros'?`<span class="tag-pill" style="color:var(--car);background:var(--car-bg);border-color:var(--car-b);cursor:default">Carneiros</span>`:''}
      </div>
    </div>
    <div class="dt-actions">
      <button class="iconbtn" onclick="startEdit('${c.id}')" title="Editar dados">Editar</button>
      <button class="iconbtn del" onclick="delC('${c.id}')" title="Remover">Remover</button>
    </div>
  </div>
  ${(c.tagIds||[]).length?`<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:10px">${(c.tagIds||[]).map(id=>tagPill(id)).join('')}</div>`:''}
</div>

<div class="dt-body">
  <!-- TAREFAS / FRENTES -->
  <div class="dt-sec">
    <div class="dt-sec-h"><h4>Frentes de trabalho <span class="n">${pend.length}</span></h4></div>
    <div id="task-list-${c.id}">
      ${pend.length?pend.map(t=>taskRow(c,t)).join(''):`<p style="font-size:12px;color:var(--muted);margin-bottom:8px">Nenhuma frente pendente. Adicione abaixo.</p>`}
    </div>
    <div class="task-add">
      <input class="ta-txt" id="nt-txt-${c.id}" placeholder="Nova frente: revisar doc, protocolar, aguardar…" onkeydown="if(event.key==='Enter')addTask('${c.id}')">
      <select id="nt-tipo-${c.id}" onchange="toggleNtJanela('${c.id}')"><option value="tarefa">Tarefa</option><option value="prazo">⚖ Prazo judicial</option><option value="followup">Follow-up</option></select>
      <span id="nt-ini-wrap-${c.id}" style="display:none;flex-direction:column;gap:2px"><span style="font-size:9px;color:var(--faint)">abre</span><input type="date" id="nt-inicio-${c.id}" style="width:130px" title="Data de abertura (opcional)"></span>
      <span style="display:flex;flex-direction:column;gap:2px"><span id="nt-data-lbl-${c.id}" style="font-size:9px;color:var(--faint)">data</span><input type="date" id="nt-data-${c.id}" style="width:130px" title="Data fatal"></span>
      <button class="btn btn-pri btn-sm" onclick="addTask('${c.id}')">Adicionar</button>
    </div>
    ${done.length?`<div style="margin-top:12px"><button class="alink" onclick="toggleDone('${c.id}')">${_showDone[c.id]?'Ocultar':'Ver'} ${done.length} concluída${done.length>1?'s':''}</button>${_showDone[c.id]?`<div style="margin-top:6px;opacity:.7">${done.map(t=>taskRow(c,t)).join('')}</div>`:''}</div>`:''}
  </div>

  <!-- RESUMO -->
  ${c.subject||c.nextSteps?`<div class="dt-sec">
    <div class="dt-sec-h"><h4>Resumo do caso</h4></div>
    ${c.subject?`<p style="font-size:12.5px;color:var(--muted);margin-bottom:8px">${esc(c.subject)}</p>`:''}
    ${c.nextSteps?`<div class="summary-box">${esc(c.nextSteps)}</div>`:''}
  </div>`:''}

  <!-- HONORÁRIOS mini -->
  <div class="dt-sec">
    <div class="dt-sec-h"><h4>Honorários</h4><button class="btn btn-ghost btn-sm" onclick="openModal('hon','${c.id}')">+ Lançar</button></div>
    ${hons.length?`<div class="info-grid" style="grid-template-columns:1fr">${hons.map(h=>honMini(c,h)).join('')}</div>${hRest>0?`<p style="font-size:11.5px;color:var(--ora);font-weight:600;margin-top:8px">A receber: ${fCur(hRest)}</p>`:`<p style="font-size:11.5px;color:var(--grn);font-weight:600;margin-top:8px">✓ Quitado</p>`}`:`<p style="font-size:12px;color:var(--muted)">Nenhum honorário lançado.</p>`}
  </div>

  <!-- HISTÓRICO -->
  <div class="dt-sec">
    <div class="dt-sec-h"><h4>Histórico / evolução <span class="n">${hist.length}</span></h4></div>
    <div class="hist-add">
      <input id="nh-txt-${c.id}" placeholder="Registrar evolução (data de hoje)…" onkeydown="if(event.key==='Enter')addHist('${c.id}')">
      <button class="btn btn-ghost btn-sm" onclick="addHist('${c.id}')">Registrar</button>
    </div>
    ${hist.length?`<div style="margin-top:8px">${hist.map(h=>`<div class="hist-item"><span class="hist-date">${fDateShort(h.data)}</span><span class="hist-txt">${esc(h.texto)}</span><button class="task-x" onclick="delHist('${c.id}','${h.id}')">×</button></div>`).join('')}</div>`:`<p style="font-size:12px;color:var(--muted);margin-top:8px">Sem registros ainda. Cada baixa de tarefa entra aqui automaticamente.</p>`}
  </div>
</div>`;
}
let _showDone={};
function toggleDone(cid){_showDone[cid]=!_showDone[cid];render();}

function taskRow(c,t){
  const d=t.data?daysTo(t.data):null;
  let cls=t.tipo==='prazo'?'t-jud':t.tipo==='followup'?'t-fu':'';
  if(!t.feito&&d!==null){if(d<0)cls='t-over';else if(d<=7&&t.tipo!=='prazo')cls='t-urg';}
  let dCls='';if(d!==null){if(t.tipo==='prazo')dCls='jud';else if(d<0)dCls='over';else if(d<=7)dCls='urg';}
  const tipoLbl=TASK_TIPOS[t.tipo]?TASK_TIPOS[t.tipo].label:'Tarefa';
  const temJanela=t.tipo==='prazo'&&t.dataInicio;
  const calHref=temJanela?gcalWindow(c.client+' — '+t.texto,t.dataInicio,t.data,c.processNumber):gcalLink(c.client+' — '+t.texto,t.data,c.processNumber);
  return`<div class="task ${cls}" data-tid="${t.id}" style="${t.feito?'opacity:.6':''}">
    <input type="checkbox" class="task-chk" ${t.feito?'checked':''} onchange="toggleTask('${c.id}','${t.id}',this.checked)">
    <div class="task-c">
      <div class="task-txt" style="${t.feito?'text-decoration:line-through':''}">${esc(t.texto)}</div>
      <div class="task-meta">
        ${t.tipo==='prazo'?`<span class="jud-stamp">⚖ Judicial</span>`:`<span style="color:var(--faint)">${tipoLbl}</span>`}
        ${temJanela?`<span style="font-size:10px;color:var(--muted)">abre ${fDateShort(t.dataInicio)} →</span>`:''}
        ${t.data?`<span class="task-date ${dCls}">${temJanela?'fatal ':''}${fDate(t.data)}${d!==null&&!t.feito?' · '+(d<0?Math.abs(d)+'d atraso':d===0?'hoje':d+'d'):''}</span>`:''}
        ${t.data&&!t.feito?`<a href="${calHref}" target="_blank" class="mini-cal" style="padding:1px 6px">Agenda</a>`:''}
      </div>
    </div>
    <button class="task-x" onclick="delTask('${c.id}','${t.id}')">×</button>
  </div>`;
}
function honMini(c,h){
  const pago=getPago(h),total=h.valor||0,rest=total-pago;
  const prox=getProximaParcelaAberta(h);
  return`<div class="info-cell" style="display:flex;justify-content:space-between;align-items:center">
    <div><div class="k">${h.tipo==='proLabore'?'Pro-labore':'Êxito'}${h.gatilho&&!h.gatilhoAtivado?' · gatilho pendente':''}</div><div class="v">${fCur(pago)} de ${fCur(total)}${prox&&prox.vencimento?' · próx. '+fDateShort(prox.vencimento):''}</div></div>
    <span style="font-size:12px;font-weight:700;color:${rest>0?'var(--ora)':'var(--grn)'}">${rest>0?fCur(rest):'✓'}</span>
  </div>`;
}

// task actions
function addTask(cid){
  const c=S.casos.find(x=>x.id===cid);if(!c)return;if(!c.tarefas)c.tarefas=[];
  const txt=gv('nt-txt-'+cid).trim();if(!txt)return;
  const tipo=gv('nt-tipo-'+cid)||'tarefa';const data=gv('nt-data-'+cid)||'';
  const dataInicio=tipo==='prazo'?(gv('nt-inicio-'+cid)||''):'';
  c.tarefas.push({id:uid(),texto:txt,tipo,data,dataInicio,feito:false,dataFeito:''});
  saveData();render();
  setTimeout(()=>{const el=document.getElementById('nt-txt-'+cid);if(el)el.focus();},60);
}
function toggleNtJanela(cid){
  const isPrazo=gv('nt-tipo-'+cid)==='prazo';
  const w=document.getElementById('nt-ini-wrap-'+cid);if(w)w.style.display=isPrazo?'flex':'none';
  const lbl=document.getElementById('nt-data-lbl-'+cid);if(lbl)lbl.textContent=isPrazo?'fatal':'data';
}
function toggleTask(cid,tid,checked){
  const c=S.casos.find(x=>x.id===cid);if(!c)return;const t=(c.tarefas||[]).find(x=>x.id===tid);if(!t)return;
  t.feito=checked;t.dataFeito=checked?new Date().toISOString().slice(0,10):'';
  if(checked){if(!c.historico)c.historico=[];c.historico.unshift({id:uid(),data:t.dataFeito,texto:'✓ '+t.texto});}
  saveData();render();
}
function delTask(cid,tid){
  const c=S.casos.find(x=>x.id===cid);if(!c)return;c.tarefas=(c.tarefas||[]).filter(x=>x.id!==tid);saveData();render();
}
function addHist(cid){
  const c=S.casos.find(x=>x.id===cid);if(!c)return;if(!c.historico)c.historico=[];
  const txt=gv('nh-txt-'+cid).trim();if(!txt)return;
  c.historico.unshift({id:uid(),data:new Date().toISOString().slice(0,10),texto:txt});
  saveData();render();
}
function delHist(cid,hid){
  const c=S.casos.find(x=>x.id===cid);if(!c)return;c.historico=(c.historico||[]).filter(x=>x.id!==hid);saveData();render();
}

// ── kanban card + drag ─────────────────────────────────
function kbCard(c){
  const hasJud=judTasks(c).length>0;const p=nextPrazo(c);const d=p?daysTo(p):null;
  return`<div class="kb-card ${hasJud?'has-jud':''}" draggable="true" data-id="${c.id}" onclick="if(!_dragging)selectKbCaso('${c.id}')">
    <div class="kb-card-name">${c.client}</div>
    <div class="kb-card-meta">${c.type==='consultivo'?'Consultivo':(c.tribunal||'—')}${c.processNumber?' · '+c.processNumber:''}</div>
    ${hasJud&&d!==null?`<div class="kb-card-jud"><span class="jud-stamp">⚖ ${d<0?Math.abs(d)+'d atr.':d===0?'hoje':d+'d'}</span></div>`:''}
    ${(c.tagIds||[]).length?`<div class="kb-card-tags" onclick="event.stopPropagation()">${(c.tagIds||[]).map(id=>tagPill(id)).join('')}</div>`:''}
  </div>`;
}
function selectKbCaso(id){S.casosView='lista';S.selCaso=id;S.mobileDetail=true;render();window.scrollTo(0,0);}

function wireKanban(type){
  _dragging=false;
  document.querySelectorAll('.kb-card').forEach(card=>{
    card.addEventListener('dragstart',e=>{_dragging=true;_dragId=card.dataset.id;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');setTimeout(()=>_dragging=false,50);});
  });
  document.querySelectorAll('.kb-drop').forEach(drop=>{
    drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
    drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
    drop.addEventListener('drop',e=>{
      e.preventDefault();drop.classList.remove('over');
      const newStatus=drop.dataset.status;if(!_dragId)return;
      if(type==='caso'){const c=S.casos.find(x=>x.id===_dragId);if(c&&c.status!==newStatus){c.status=newStatus;saveData();render();}}
      else{const p=S.prospeccao.find(x=>x.id===_dragId);if(p&&p.stage!==newStatus){p.stage=newStatus;saveData();render();}}
      _dragId=null;

  });

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="font-size:13px;font-weight:600">NFs emitidas este mês</h3><button class="btn btn-pri btn-sm" onclick="openModal('nf')">+ Registrar NF</button></div>

  <div class="fg" id="mh-total-wrap" style="display:none"><label>Total estimado do êxito</label><input id="mh-total" type="number" readonly style="background:var(--paper);color:var(--muted)"></div>
</div>
<div id="mh-parceiros-wrap" style="display:none;margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><label style="font-size:11px;color:var(--muted);font-weight:500">Parceiros no êxito</label><button type="button" class="btn btn-ghost btn-sm" onclick="addParceiro()">+ Parceiro</button></div><div id="mh-parceiros-list"></div><div id="mh-minha-parte" style="margin-top:8px;padding:8px 10px;background:var(--grn-bg);border:1px solid var(--grn-b);border-radius:var(--r);font-size:12px;color:var(--grn);font-weight:500;display:none"></div></div>
<div id="mh-gatilho-wrap" style="display:none;margin-top:12px;padding:12px;background:var(--ora-bg);border:1px solid var(--ora-b);border-radius:var(--r)"><label style="font-size:11px;color:var(--ora);font-weight:600">Gatilho do êxito — quando o valor fica devido</label><input id="mh-gatilho" placeholder="Ex: Transitado em julgado, alvará expedido, indenização recebida…" style="margin-top:6px;width:100%;padding:7px 10px;border:1px solid var(--ora-b);border-radius:var(--r);font-family:inherit;font-size:12px"></div>
<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><label style="font-size:11px;color:var(--muted);font-weight:600">Parcelas</label><button type="button" class="btn btn-ghost btn-sm" onclick="addMParcela()">+ Parcela</button></div><div id="mh-parcelas-list"></div><p style="font-size:10px;color:var(--faint);margin-top:4px">Deixe em branco para lançar sem parcelamento.</p></div>
<div class="fgrid" style="margin-top:10px"><div class="fg"><label>Follow-up — cobrar em</label><input id="mh-fu" type="date"></div><div class="fg full"><label>Observações</label><textarea id="mh-obs" rows="2" style="resize:vertical"></textarea></div></div>
<div class="factions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-pri" onclick="saveHon()">Lançar</button></div>`;
}
function honTipoChange(){const isEx=gv('mh-t')==='exito';document.getElementById('mh-calctipo-wrap').style.display=isEx?'':'none';document.getElementById('mh-parceiros-wrap').style.display=isEx?'block':'none';const gw=document.getElementById('mh-gatilho-wrap');if(gw)gw.style.display=isEx?'block':'none';honCalcChange();}
function addMParcela(){_mParcelas.push({id:uid(),descricao:'',valor:0,vencimento:'',pago:false});renderMParcelas();}
function renderMParcelas(){const el=document.getElementById('mh-parcelas-list');if(!el)return;el.innerHTML=_mParcelas.map((p,i)=>`<div style="display:grid;grid-template-columns:1fr 110px 130px 32px;gap:6px;margin-bottom:6px;align-items:center"><input placeholder="Descrição (ex: Parcela 1)" value="${esc(p.descricao)}" oninput="_mParcelas[${i}].descricao=this.value" style="padding:6px 8px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:12px"><input type="number" placeholder="Valor R$" value="${p.valor||''}" oninput="_mParcelas[${i}].valor=parseFloat(this.value)||0" style="padding:6px 8px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:12px"><input type="date" value="${p.vencimento||''}" oninput="_mParcelas[${i}].vencimento=this.value" style="padding:6px 8px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:12px"><button type="button" onclick="_mParcelas.splice(${i},1);renderMParcelas()" style="background:var(--red-bg);border:1px solid var(--red-b);border-radius:var(--r);color:var(--red);cursor:pointer;font-size:14px;height:32px">×</button></div>`).join('');}
function honCalcChange(){const isPct=gv('mh-ct')==='percentual';document.getElementById('mh-pct-wrap').style.display=isPct?'':'none';document.getElementById('mh-causa-wrap').style.display=isPct?'':'none';document.getElementById('mh-total-wrap').style.display=isPct?'':'none';honCalcValor();}
function honCalcValor(){const isPct=gv('mh-ct')==='percentual'&&gv('mh-t')==='exito';if(isPct){const pct=parseFloat(gv('mh-pct'))||0,causa=parseFloat(gv('mh-causa'))||0;const el=document.getElementById('mh-total');if(el)el.value=(causa*pct/100).toFixed(2);}updateMinhaParte();}
function addParceiro(){_parceiros.push({nome:'',pct:0});renderParceirosList();}
function removeParceiro(i){_parceiros.splice(i,1);renderParceirosList();updateMinhaParte();}
function renderParceirosList(){const el=document.getElementById('mh-parceiros-list');if(!el)return;el.innerHTML=_parceiros.map((p,i)=>`<div style="display:grid;grid-template-columns:1fr 100px 32px;gap:6px;margin-bottom:6px;align-items:center"><input placeholder="Nome do parceiro" value="${esc(p.nome)}" oninput="_parceiros[${i}].nome=this.value" style="padding:6px 8px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:12px"><div style="position:relative"><input type="number" placeholder="%" value="${p.pct||''}" min="0" max="100" oninput="_parceiros[${i}].pct=parseFloat(this.value)||0;updateMinhaParte()" style="padding:6px 8px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:12px;width:100%"><span style="position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted)">%</span></div><button type="button" onclick="removeParceiro(${i})" style="background:var(--red-bg);border:1px solid var(--red-b);border-radius:var(--r);color:var(--red);cursor:pointer;font-size:14px;height:32px">×</button></div>`).join('');updateMinhaParte();}
function updateMinhaParte(){const el=document.getElementById('mh-minha-parte');if(!el)return;if(!_parceiros.length){el.style.display='none';return;}const totalPct=_parceiros.reduce((s,p)=>s+(p.pct||0),0);const meuPct=100-totalPct;const isPct=gv('mh-ct')==='percentual'&&gv('mh-t')==='exito';let vt=isPct?(parseFloat(gv('mh-causa'))||0)*(parseFloat(gv('mh-pct'))||0)/100:(parseFloat(gv('mh-v'))||0);el.style.display='';el.textContent=`Minha parte: ${meuPct.toFixed(1)}% = ${fCur(vt*meuPct/100)}${totalPct>100?' ⚠ Total passa de 100%':''}`;el.style.color=totalPct>100?'var(--red)':'var(--grn)';el.style.borderColor=totalPct>100?'var(--red-b)':'var(--grn-b)';el.style.background=totalPct>100?'var(--red-bg)':'var(--grn-bg)';}
function saveHon(){
  const tipo=gv('mh-t'),calcTipo=tipo==='exito'?gv('mh-ct'):'fixo',isPct=calcTipo==='percentual';
  const valorCausa=parseFloat(gv('mh-causa'))||0,percentualCausa=parseFloat(gv('mh-pct'))||0;
  const v=isPct?valorCausa*percentualCausa/100:parseFloat(gv('mh-v'))||0;
  if(!v&&tipo==='proLabore'){alert('Informe o valor contratado');return;}
  if(_parceiros.reduce((s,p)=>s+(p.pct||0),0)>100){alert('O total dos parceiros passa de 100%');return;}
  const c=S.casos.find(x=>x.id===_mm.extra);if(!c)return;if(!c.honorarios)c.honorarios=[];
  const parcelas=[..._mParcelas.map(p=>({...p,id:p.id||uid()}))];
  const pago=parcelas.filter(p=>p.pago).reduce((s,p)=>s+(p.valor||0),0);
  c.honorarios.push({id:uid(),tipo,calcTipo,valor:v,percentualCausa:isPct?percentualCausa:0,valorCausa:isPct?valorCausa:0,parceiros:[..._parceiros.map(p=>({nome:p.nome,pct:p.pct}))],gatilho:tipo==='exito'?gv('mh-gatilho').trim():'',gatilhoAtivado:false,gatilhoData:'',parcelas,pago,followupDate:gv('mh-fu'),obs:gv('mh-obs').trim()});
  _parceiros=[];_mParcelas=[];saveData();closeModal();render();
}
function startHonEdit(cid,hid){if(S.editHonId===cid&&S.editHonHid===hid){S.editHonId=null;S.editHonHid=null;}else{S.editHonId=cid;S.editHonHid=hid;}render();setTimeout(()=>{const el=document.querySelector('.hedit');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},50);}
function toggleParcela(cid,hid,pid,checked){const c=S.casos.find(x=>x.id===cid);if(!c)return;const h=(c.honorarios||[]).find(x=>x.id===hid);if(!h||!h.parcelas)return;const p=h.parcelas.find(x=>x.id===pid);if(!p)return;p.pago=checked;p.dataPagamento=checked?new Date().toISOString().slice(0,10):'';h.pago=h.parcelas.filter(x=>x.pago).reduce((s,x)=>s+(x.valor||0),0);saveData();render();}
function ativarGatilho(cid,hid){const c=S.casos.find(x=>x.id===cid);if(!c)return;const h=(c.honorarios||[]).find(x=>x.id===hid);if(!h)return;h.gatilhoAtivado=true;h.gatilhoData=new Date().toISOString().slice(0,10);saveData();render();}
function cancelHonEdit(){S.editHonId=null;S.editHonHid=null;render();}
function heAddParceiro(){const list=document.getElementById('he-parceiros-list');if(!list)return;const i=list.children.length;const div=document.createElement('div');div.style.cssText='display:grid;grid-template-columns:1fr 100px 32px;gap:6px;margin-bottom:6px;align-items:center';div.innerHTML=`<input placeholder="Nome" id="hep-n-${i}" style="padding:6px 8px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:12px"><div style="position:relative"><input type="number" placeholder="%" id="hep-p-${i}" min="0" max="100" style="padding:6px 8px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:12px;width:100%"><span style="position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted)">%</span></div><button type="button" onclick="this.closest('div[style]').remove()" style="background:var(--red-bg);border:1px solid var(--red-b);border-radius:var(--r);color:var(--red);cursor:pointer;font-size:14px;height:32px">×</button>`;list.appendChild(div);}
function heAddParcelaRow(){const list=document.getElementById('he-parcelas-list');if(!list)return;const i=list.children.length;const div=document.createElement('div');div.style.cssText='display:grid;grid-template-columns:1fr 110px 130px auto 32px;gap:5px;margin-bottom:5px;align-items:center';div.innerHTML=`<input id="hpl-d-${i}" placeholder="Descrição" style="padding:5px 8px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:11px"><input type="number" id="hpl-v-${i}" placeholder="Valor" style="padding:5px 8px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:11px"><input type="date" id="hpl-venc-${i}" style="padding:5px 8px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:11px"><label style="font-size:10px;display:flex;align-items:center;gap:3px;cursor:pointer"><input type="checkbox" id="hpl-p-${i}" style="accent-color:var(--grn)"> Pago</label><button type="button" onclick="this.closest('div[style]').remove()" style="background:var(--red-bg);border:1px solid var(--red-b);border-radius:var(--r);color:var(--red);cursor:pointer;font-size:14px;height:29px">×</button>`;list.appendChild(div);}
function saveHonEdit(){
  const c=S.casos.find(x=>x.id===S.editHonId);if(!c)return;const h=(c.honorarios||[]).find(x=>x.id===S.editHonHid);if(!h)return;
  h.tipo=gv('he-t');h.calcTipo=h.tipo==='exito'?(gv('he-ct')||'fixo'):'fixo';
  if(h.calcTipo==='percentual'){h.percentualCausa=parseFloat(gv('he-v'))||0;h.valorCausa=parseFloat(gv('he-causa'))||0;h.valor=h.valorCausa*h.percentualCausa/100;}else{h.valor=parseFloat(gv('he-v'))||0;h.percentualCausa=0;h.valorCausa=0;}
  h.gatilho=h.tipo==='exito'?gv('he-gatilho').trim():'';h.followupDate=gv('he-fu');h.obs=gv('he-obs').trim();
  const plist=document.getElementById('he-parceiros-list');if(plist){const rows=plist.querySelectorAll('div[style*="grid"]');h.parceiros=[];rows.forEach((row,i)=>{const nome=(row.querySelector(`#hep-n-${i}`)||{}).value||'';const pct=parseFloat((row.querySelector(`#hep-p-${i}`)||{}).value)||0;if(nome||pct)h.parceiros.push({nome,pct});});}
  const hplist=document.getElementById('he-parcelas-list');if(hplist){const rows=hplist.querySelectorAll('div[style*="grid"]');h.parcelas=[];rows.forEach((row,i)=>{const desc=(row.querySelector(`#hpl-d-${i}`)||{}).value||'';const val=parseFloat((row.querySelector(`#hpl-v-${i}`)||{}).value)||0;const venc=(row.querySelector(`#hpl-venc-${i}`)||{}).value||'';const pago=(row.querySelector(`#hpl-p-${i}`)||{}).checked||false;h.parcelas.push({id:uid(),descricao:desc,valor:val,vencimento:venc,pago,dataPagamento:pago?new Date().toISOString().slice(0,10):''});});h.pago=h.parcelas.filter(p=>p.pago).reduce((s,p)=>s+(p.valor||0),0);}
  S.editHonId=null;S.editHonHid=null;saveData();render();
}
function delHon(cid,hid){const c=S.casos.find(x=>x.id===cid);if(!c)return;c.honorarios=c.honorarios.filter(h=>h.id!==hid);saveData();render();}

// ══ TAGS ═══════════════════════════════════════════════
let _tagEditColor='blue';
function bTagModal(){
  return`<div style="margin-bottom:16px"><div style="display:flex;flex-wrap:wrap;gap:6px">${TAG_COLORS.map(c=>`<div class="tag-color-swatch${_tagEditColor===c.id?' sel':''}" style="background:${c.hex}" onclick="_tagEditColor='${c.id}';document.querySelectorAll('.tag-color-swatch').forEach(el=>el.classList.remove('sel'));this.classList.add('sel')"></div>`).join('')}</div>
  <div style="display:flex;gap:8px;margin-top:10px"><input id="tag-new-lbl" placeholder="Nome da tag" style="flex:1;padding:8px 11px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:12.5px"><button class="btn btn-pri" onclick="createTag()">Criar</button></div></div>
  <div style="border-top:1px solid var(--line);padding-top:12px"><p class="sec-title">Tags existentes</p>${S.tags.map(t=>{const col=getColor(t.color);return`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)"><span class="tag-pill" style="color:${col.hex};background:${col.bg};border-color:${col.bd};cursor:default">${t.label}</span><span style="font-size:10px;color:var(--muted);flex:1">${S.casos.filter(c=>(c.tagIds||[]).includes(t.id)).length} caso(s) · ${S.prospeccao.filter(p=>(p.tagIds||[]).includes(t.id)).length} prospecção(ões)</span><button class="alink del" onclick="deleteTag('${t.id}')">Remover</button></div>`;}).join('')}</div>`;
}
function createTag(){const lbl=gv('tag-new-lbl').trim();if(!lbl){alert('Informe o nome');return;}if(S.tags.find(t=>t.label.toLowerCase()===lbl.toLowerCase())){alert('Tag já existe');return;}S.tags.push({id:'tag-'+uid(),label:lbl,color:_tagEditColor});saveData();document.getElementById('modal-body').innerHTML=bTagModal();}
function deleteTag(id){if(!confirm('Remover esta tag?'))return;S.tags=S.tags.filter(t=>t.id!==id);S.casos.forEach(c=>{if(c.tagIds)c.tagIds=c.tagIds.filter(x=>x!==id);});S.prospeccao.forEach(p=>{if(p.tagIds)p.tagIds=p.tagIds.filter(x=>x!==id);});if(S.activeTagFilter===id)S.activeTagFilter=null;saveData();document.getElementById('modal-body').innerHTML=bTagModal();}

// ══ EXPORT ═════════════════════════════════════════════
function exportResume(){
  const lines=['=== ESTADO ATUAL — ESCRITÓRIO ===','','CASOS ATIVOS:'];
  sortC(S.casos.filter(c=>c.status!=='encerrado')).forEach(c=>{
    lines.push('• '+c.client+' ['+sLabel(c.status)+']'+(c.tribunal?' — '+c.tribunal:'')+(c.processNumber?' ('+c.processNumber+')':''));
    judTasks(c).forEach(t=>lines.push('  ⚖ PRAZO '+fDate(t.data)+': '+t.texto));
    pendTasks(c).filter(t=>t.tipo!=='prazo').slice(0,4).forEach(t=>lines.push('  → '+t.texto+(t.data?' ('+fDate(t.data)+')':'')));
  });
  lines.push('','PROSPECÇÕES ATIVAS:');
  S.prospeccao.filter(p=>!['fechado','perdido'].includes(p.stage)).forEach(p=>lines.push('• '+p.name+' ['+((STAGES.find(s=>s.id===p.stage)||{}).label||p.stage)+']'+(p.subject?' — '+p.subject:'')));
  const txt=lines.join('\n');
  navigator.clipboard.writeText(txt).then(()=>alert('Copiado! Cole no Claude para sincronizar.')).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('Copiado!');});
}

// ══ MIGRATION ══════════════════════════════════════════
function migrate(){
  const carIds={c03:true,c14:true,c15:true};
  S.casos.forEach(c=>{
    if(!c.tarefas)c.tarefas=[];if(!c.historico)c.historico=[];if(!c.tagIds)c.tagIds=[];
    if(carIds[c.id]&&c.group!=='carneiros')c.group='carneiros';
    if(carIds[c.id]&&!c.tagIds.includes('tag-car'))c.tagIds.push('tag-car');
    (c.honorarios||[]).forEach(h=>{if(!h.parcelas)h.parcelas=[];});
    // garantir campo de janela nas tarefas de prazo
    c.tarefas.forEach(t=>{if(t.tipo==='prazo'&&t.dataInicio===undefined)t.dataInicio='';});
    // legado: se tem deadline mas nenhum prazo judicial, cria tarefa de prazo
    if(c.deadline&&!c.tarefas.some(t=>t.tipo==='prazo'&&t.data===c.deadline)){
      c.tarefas.push({id:uid(),texto:'Prazo judicial',tipo:'prazo',data:c.deadline,dataInicio:'',feito:false,dataFeito:''});
    }
  });
  S.prospeccao.forEach(p=>{if(!p.tagIds)p.tagIds=[];});
}
async function init(){loadLocal();migrate();syncDeadlines();render();await syncFromSheet();}
window.addEventListener('resize',setTop);
init();
</script>
